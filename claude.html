<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Defence in depth: task content is sanitised in JS before it is rendered, and
     this CSP means even a sanitiser bug cannot execute injected script. Inline
     <script>/<style> here are covered by 'unsafe-inline' (no build step to hash
     against), but external and eval'd script are blocked outright. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Claude Task Dashboard</title>
<link rel="icon" href="favicon.ico">
<script>
  // Apply saved theme and text size before render to avoid a flash of the defaults.
  // Both are validated against the known sets so a stale or hand-edited
  // localStorage value falls back cleanly instead of leaving the pickers blank.
  // Keep in sync with the [data-theme=...] blocks and the picker's <option>s.
  var THEMES = ['midnight','dark','light','sepia']; // retired themes fall back to midnight below
  var SIZES = ['0.85','1','1.15','1.3','1.5'];
  var t = localStorage.getItem('dashboard-theme');
  var s = localStorage.getItem('dashboard-textsize');
  document.documentElement.setAttribute('data-theme', THEMES.indexOf(t) > -1 ? t : 'midnight');
  document.documentElement.style.setProperty('--scale', SIZES.indexOf(s) > -1 ? s : '1');
</script>
<script src="data/data-daily-news-briefing.js"></script>
<script src="data/data-ios-beta-weekly-check.js"></script>
<script src="data/data-buffalo-weekend-events.js"></script>
<script src="data/data-streaming-weekly-digest.js"></script>
<script src="data/data-daily-claude-news.js"></script>
<script src="data/data-iphone-rumors-daily.js"></script>
<script src="data/data-macos-beta-weekly-check.js"></script>
<script src="data/data-glp1-daily-news.js"></script>
<style>
  /* ---- Themes ---- */
  /* Values transcribed from the unified theme pack (tokens.json in the private
     claude-theme-pack repo — the source of truth for every app's palette; this
     page keeps them inline because it is a single self-contained file). Token
     mapping: bg←bg, card-bg←surface, header-hover & chip-stale-bg←surfaceAlt,
     divider←border, border←borderStrong (decorative), ctl-border←borderControl
     (3:1 on page and card), text & heading←textPrimary, muted &
     chip-stale-text←textMuted, faint←textHint, chip-text & link←accent,
     chip-bg←accentBg; body-text←textSecondary on the dark themes (the old
     dimmed-body look), textPrimary on the light ones. Sepia's accent is
     monochrome, so its chips/links use the pack's err/errBg pair instead —
     the same warm red the old sepia used, and AA-verified by the pack's gate.
     Don't retune values here; change the pack and re-transcribe. */
  :root, [data-theme="midnight"] {
    --bg: #0a0e1a; --text: #e7eaf6; --heading: #e7eaf6; --muted: #838cab;
    --card-bg: #121829; --border: #374163; --header-hover: #1b2238; --divider: #262f4a;
    --chip-text: #818cf8; --chip-bg: #242b4a; --chip-stale-text: #838cab; --chip-stale-bg: #1b2238;
    --faint: #7f88a9; --body-text: #aab2d0; --link: #818cf8; --ctl-border: #536396;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  [data-theme="dark"] {
    --bg: #13151b; --text: #eef0f5; --heading: #eef0f5; --muted: #9396a3;
    --card-bg: #1c1f27; --border: #3d424e; --header-hover: #262a33; --divider: #2d313b;
    --chip-text: #eef0f5; --chip-bg: #3c3e46; --chip-stale-text: #9396a3; --chip-stale-bg: #262a33;
    --faint: #8c909d; --body-text: #adb1bd; --link: #eef0f5; --ctl-border: #626a7d;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  [data-theme="light"] {
    --bg: #f5f5f3; --text: #111110; --heading: #111110; --muted: #656562;
    --card-bg: #ffffff; --border: #c8c8c4; --header-hover: #f0f0ee; --divider: #e0e0dd;
    --chip-text: #266dc3; --chip-bg: #e9f0f9; --chip-stale-text: #656562; --chip-stale-bg: #f0f0ee;
    --faint: #6d6d6d; --body-text: #111110; --link: #266dc3; --ctl-border: #8e8e86;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  [data-theme="sepia"] {
    --bg: #f3ead7; --text: #3a3020; --heading: #3a3020; --muted: #6a5e46;
    --card-bg: #fbf5e7; --border: #cbb992; --header-hover: #eee2c9; --divider: #e0d3b4;
    --chip-text: #721d25; --chip-bg: #f4d7da; --chip-stale-text: #6a5e46; --chip-stale-bg: #eee2c9;
    --faint: #71644b; --body-text: #3a3020; --link: #721d25; --ctl-border: #9c824b;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --scale: 1; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 32px 24px; transition: background 0.15s, color 0.15s; }
  h1 { font-size: calc(28px * var(--scale)); font-weight: 600; margin-bottom: 6px; color: var(--heading); }
  .subtitle { color: var(--muted); font-size: calc(14px * var(--scale)); margin-bottom: 36px; }
  .grid { display: flex; flex-direction: column; gap: 24px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  /* The header is a real <button> (inside an <h2>) so it is keyboard-reachable
     and announced as an expandable control. These rules undo the UA button
     styling; the layout below is unchanged. */
  .card-header-h { font-size: inherit; font-weight: inherit; }
  .card-header { width: 100%; font: inherit; color: inherit; background: none; border: none; border-bottom: 1px solid transparent; text-align: left;
                 padding: 18px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; transition: background 0.12s; }
  .card-header:hover { background: var(--header-hover); }
  .card-header:focus-visible { outline: 2px solid var(--link); outline-offset: -3px; }
  .card.expanded .card-header { border-bottom-color: var(--divider); padding-bottom: 14px; }
  .card-title { display: block; font-size: calc(16px * var(--scale)); font-weight: 600; color: var(--heading); }
  .chevron { display: inline-block; width: 12px; color: var(--muted); margin-right: 8px; transition: transform 0.15s; font-size: calc(11px * var(--scale)); }
  .card.expanded .chevron { transform: rotate(90deg); }
  .card-headline { display: block; }
  .card-updated { display: block; text-align: right; flex-shrink: 0; }
  .updated-ago { font-size: calc(12px * var(--scale)); color: var(--chip-text); background: var(--chip-bg); border-radius: 6px; padding: 3px 8px; white-space: nowrap; display: inline-block; }
  .updated-ago.stale { color: var(--chip-stale-text); background: var(--chip-stale-bg); }
  .updated-full { display: block; font-size: calc(11px * var(--scale)); color: var(--faint); margin-top: 5px; white-space: nowrap; }
  .card-meta { display: block; font-size: calc(12px * var(--scale)); color: var(--muted); margin-top: 4px; font-weight: 400; }
  /* Same size/token as .updated-full: the two are a matched pair — when the
     card is due on the left, when it last ran on the right. */
  .card-schedule { display: block; font-size: calc(11px * var(--scale)); color: var(--faint); margin-top: 5px; font-weight: 400; }
  .sched-icon { margin-right: 6px; }
  .card-body { display: none; padding: 20px; font-size: calc(14px * var(--scale)); line-height: 1.7; color: var(--body-text); white-space: pre-wrap; word-break: break-word; }
  .card.expanded .card-body { display: block; }
  .empty { color: var(--faint); font-style: italic; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* Citation links sit inside body text, where colour alone does not separate
     them from the surrounding prose (WCAG 1.4.1) — only the Light theme clears
     3:1 against --body-text. Underlining them makes the cue non-colour-based
     in every theme; hover thickens it. */
  .card-body a { text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .card-body a:hover { text-decoration-thickness: 2px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .ctl { font-size: calc(12px * var(--scale)); color: var(--muted); background: var(--chip-stale-bg); border: 1px solid var(--ctl-border); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-family: var(--font); }
  .ctl:hover { color: var(--heading); }
  .ctl:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 2px; }
  select.ctl { -webkit-appearance: none; appearance: none; padding-right: 26px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' fill='none' stroke='%238b949e' stroke-width='1.5'/></svg>"); background-repeat: no-repeat; background-position: right 9px center; }

  /* ---- Narrow screens: let the header and card headers wrap instead of squeezing/clipping ---- */
  @media (max-width: 640px) {
    body { padding: 20px 12px; }
    h1 { font-size: calc(22px * var(--scale)); }
    .header-row { flex-wrap: wrap; }
    .grid { gap: 16px; }
    .card-header { flex-wrap: wrap; }
    .card-updated { width: 100%; text-align: left; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .updated-full { margin-top: 0; }
    .card-body { padding: 16px; }
  }

  /* Respect the OS "reduce motion" setting. */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="header-row">
  <div>
    <h1>Claude Task Dashboard</h1>
  </div>
  <div class="controls">
    <select class="ctl" id="textsize" aria-label="Text size">
      <option value="0.85">🔠 Small</option>
      <option value="1">🔠 Normal</option>
      <option value="1.15">🔠 Large</option>
      <option value="1.3">🔠 XL</option>
      <option value="1.5">🔠 XXL</option>
    </select>
    <select class="ctl" id="theme" aria-label="Theme">
      <option value="dark">☾ Dark</option>
      <option value="light">☀️ Light</option>
      <option value="midnight">✦ Midnight</option>
      <option value="sepia">📜 Sepia</option>
    </select>
    <button class="ctl" onclick="location.reload()">↻ Refresh</button>
  </div>
</div>
<noscript>
  <p>This dashboard needs JavaScript to display your scheduled-task output.</p>
</noscript>
<main class="grid" id="grid"></main>

<script>
// ---- Theme picker ----
const themeSelect = document.getElementById('theme');
themeSelect.value = document.documentElement.getAttribute('data-theme');
themeSelect.addEventListener('change', () => {
  document.documentElement.setAttribute('data-theme', themeSelect.value);
  localStorage.setItem('dashboard-theme', themeSelect.value);
});

// ---- Text size picker ----
const sizeSelect = document.getElementById('textsize');
sizeSelect.value = localStorage.getItem('dashboard-textsize') || '1';
sizeSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--scale', sizeSelect.value);
  localStorage.setItem('dashboard-textsize', sizeSelect.value);
});

const TASKS = [
  {
    id: 'daily-news-briefing',
    title: '🗞️ Daily News Briefing',
    schedule: 'Every day at 1:45 AM',
    description: 'Local Pendleton/Buffalo/WNY, US, and global headlines'
  },
  {
    id: 'ios-beta-weekly-check',
    title: '📱 iOS Beta Check',
    schedule: 'Every Wednesday at 12:45 AM',
    description: 'Go/no-go recommendation for iPhone 15 Pro Max'
  },
  {
    id: 'buffalo-weekend-events',
    title: '🎉 Buffalo Weekend Events',
    schedule: 'Every Friday at 12:00 AM',
    description: 'Free & paid events in and around Buffalo'
  },
  {
    id: 'streaming-weekly-digest',
    title: '📺 Streaming Digest',
    schedule: 'Every Friday at 12:15 AM',
    description: 'New on Apple TV+, Crunchyroll, and Prime Video'
  },
  {
    id: 'daily-claude-news',
    title: '🤖 Claude and Other AI News',
    schedule: 'Every day at 1:30 AM',
    description: 'Latest Anthropic, Claude, and AI industry news from the past 24 hours'
  },
  {
    id: 'iphone-rumors-daily',
    title: '📲 iPhone Rumors',
    schedule: 'Every Monday at 1:00 AM',
    description: 'Next-iPhone rumor roundup, grouped by confidence level'
  },
  {
    id: 'macos-beta-weekly-check',
    title: '💻 macOS Beta Check',
    schedule: 'Every Wednesday at 12:30 AM',
    description: 'Go/no-go recommendation for Apple Silicon MacBook Pro'
  },
  {
    id: 'glp1-daily-news',
    title: '💉 GLP-1 News',
    schedule: 'Every day at 1:15 AM',
    description: 'GLP-1 drug news — trials, FDA actions, and industry developments'
  }
];

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ESC[c]);
}

// Task content is written by scheduled tasks that summarise pages from the open
// web, so it is untrusted and must never reach innerHTML unescaped. Everything
// is escaped first, then a small allowlist is re-enabled:
//   * bare <strong>/<em>/<b>/<i>/<br> with no attributes (the data uses <strong>)
//   * [label](http(s)://...) markdown links
// Because the URL is already escaped when it is placed in the href, a quote
// inside it becomes &quot; and cannot break out to forge a new attribute.
// A tag carrying attributes (e.g. <strong onclick=...>) never matches the
// allowlist and stays escaped as visible text.
function formatContent(text) {
  if (typeof text !== 'string') return '';
  let out = escapeHtml(text);
  out = out.replace(/&lt;(\/?)(strong|em|b|i|br)\s*\/?&gt;/gi,
    (m, slash, tag) => `<${slash}${tag.toLowerCase()}>`);
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    (m, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
  return out;
}

function parseStamp(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  return Number.isFinite(t) ? t : null;
}

// Reports the distance from now in the largest sensible unit. A timestamp ahead
// of the clock is labelled "from now" rather than silently reading as fresh,
// so a skewed clock or a bad mtime is visible instead of hidden.
function timeAgo(t) {
  const signed = Date.now() - t;
  const future = signed < -60000;
  const m = Math.floor(Math.abs(signed) / 60000);
  if (m < 1) return 'just now';
  let out;
  if (m < 60) out = `${m}m`;
  else {
    const h = Math.floor(m / 60);
    out = h < 24 ? `${h}h` : `${Math.floor(h / 24)}d`;
  }
  return future ? `${out} from now` : `${out} ago`;
}

const grid = document.getElementById('grid');
const data = window.taskData || {};

TASKS.sort((a, b) => (parseStamp(data[b.id]?.updatedAt) || 0) - (parseStamp(data[a.id]?.updatedAt) || 0));

function collapseAll() {
  document.querySelectorAll('.card.expanded').forEach(c => {
    c.classList.remove('expanded');
    c.querySelector('.card-header').setAttribute('aria-expanded', 'false');
  });
}

TASKS.forEach(task => {
  // One malformed data file must not blank the rest of the dashboard, so each
  // card renders independently and failures degrade to a visible notice.
  try {
    const d = data[task.id];
    const stamp = parseStamp(d?.updatedAt);
    const isStale = stamp === null;
    const agoLabel = stamp !== null ? `Updated ${timeAgo(stamp)}`
                   : d?.updatedAt ? 'Timestamp unreadable' : 'No data yet';
    const fullLabel = stamp !== null ? new Date(stamp).toLocaleString()
                    : d?.updatedAt ? String(d.updatedAt) : 'waiting for first run';
    const raw = typeof d?.content === 'string' ? d.content : '';
    const bodyHtml = raw.trim() ? formatContent(raw)
                   : '<span class="empty">No output yet — waiting for first run.</span>';
    const bodyId = `body-${task.id}`;
    const titleId = `title-${task.id}`;

    const card = document.createElement('div');
    card.className = 'card';
    // The header is a <button> inside an <h2>: keyboard-focusable, announced as
    // an expandable control, and Enter/Space work natively. Every interpolated
    // value is escaped even where it is currently a hard-coded constant.
    card.innerHTML = `
      <h2 class="card-header-h">
        <button type="button" class="card-header" aria-expanded="false" aria-controls="${bodyId}">
          <span class="card-headline">
            <span class="card-title" id="${titleId}"><span class="chevron" aria-hidden="true">▶</span>${escapeHtml(task.title)}</span>
            <span class="card-meta">${escapeHtml(task.description)}</span>
            ${task.schedule ? `<span class="card-schedule"><span class="sched-icon" aria-hidden="true">🕐</span>${escapeHtml(task.schedule)}</span>` : ''}
          </span>
          <span class="card-updated">
            <span class="updated-ago ${isStale ? 'stale' : ''}">${escapeHtml(agoLabel)}</span>
            <span class="updated-full">${escapeHtml(fullLabel)}</span>
          </span>
        </button>
      </h2>
      <div class="card-body" id="${bodyId}" role="region" aria-labelledby="${titleId}">${bodyHtml}</div>
    `;

    const btn = card.querySelector('.card-header');
    btn.addEventListener('click', () => {
      const wasExpanded = card.classList.contains('expanded');
      collapseAll();
      if (!wasExpanded) {
        card.classList.add('expanded');
        btn.setAttribute('aria-expanded', 'true');
        // Bring the top of the expanded card to the top of the viewport.
        requestAnimationFrame(() => {
          const top = card.getBoundingClientRect().top + window.scrollY - 16;
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          window.scrollTo({ top, behavior: reduce ? 'auto' : 'smooth' });
        });
      }
    });
    grid.appendChild(card);
  } catch (err) {
    console.error(`Failed to render task "${task.id}":`, err);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="card-body" style="display:block">
      <span class="empty">${escapeHtml(task.title)} — could not be displayed (malformed data file).</span>
    </div>`;
    grid.appendChild(card);
  }
});
</script>
</body>
</html>
