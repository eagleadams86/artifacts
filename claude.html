<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Defence in depth: task content is sanitised in JS before it is rendered, and
     this CSP means even a sanitiser bug cannot execute injected script. Inline
     <script>/<style> here are covered by 'unsafe-inline' (no build step to hash
     against), but external and eval'd script are blocked outright. -->
<!-- manifest-src is 'self' for the install manifest, and it has to be spelled
     out: it falls back to default-src, which is 'none' here, so without this the
     fetch of manifest.webmanifest is refused and "Install app" silently stops
     being offered — no error anywhere except the console. What it allows is a
     static JSON file on this origin and nothing else; a manifest executes nothing
     and reads no data. Same line, same reasoning, in every sibling app. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Claude Task Dashboard</title>
<!-- The mark is what this page is: a stack of task cards, the front one carrying two
     lines of its content, on the tile the rest of the app family wears — midnight
     page, soft disc in the corner. The SVG is what every current browser shows;
     favicon.ico is the fallback a browser fetches from the site root on its own, and
     what a bookmark uses. The two are the same picture — make_favicon.py draws this
     geometry — so keep them in step. The cards are flat fills, not a gradient: the
     front one has to be the LIGHTER tone or the stack reads inside out, and the
     page-coloured rect between them is the gap that stops two overlapping indigo
     rectangles reading as one odd polygon. img-src allows data: URIs, so no extra
     request. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'> <rect width='64' height='64' rx='14' fill='%230a0e1a'/> <circle cx='14' cy='52' r='20' fill='%23141c33'/> <rect x='13' y='10' width='30' height='26' rx='6' fill='%23818cf8'/> <rect x='16.5' y='23.5' width='35' height='31' rx='8.5' fill='%230a0e1a'/> <rect x='19' y='26' width='30' height='26' rx='6' fill='%23a5b4fc'/> <path d='M25 34H43M25 44H37' stroke='%230a0e1a' stroke-width='4' stroke-linecap='round'/> </svg>">
<link rel="alternate icon" href="favicon.ico?v=1">
<!-- Installing the dashboard. The manifest is what turns Chrome's "Install page
     as app…" into a real install: its own window with no browser chrome, its own
     icon in the Dock or on the taskbar, opening straight on this page.

     UNLIKE the sibling apps, this does NOT bring offline with it. Those have a
     service worker; this page has none, and it should not — what it displays is
     task output that is rewritten hourly, and a cached copy of that presented as
     current is a wrong answer rather than an old page. Installed, it still needs
     the network, and that is the right trade for what it shows.

     `start_url` is claude.html rather than "./": the directory index is a
     redirect stub, and a standalone window should not open on a meta-refresh.

     The icons it names are FILES rather than the inline data URI above, because a
     manifest's icons are fetched by URL. make_favicon.py writes them from the
     same drawing. Each is named in .gitignore's whitelist — a new file here
     without a line there is silently never committed. -->
<link rel="manifest" href="manifest.webmanifest">
<!-- The colour of the window's title bar in an installed app. Midnight's page
     colour to start with, because that is the default theme; the theme picker
     rewrites it, so an installed window follows the theme. -->
<meta name="theme-color" content="#0a0e1a">
<script>
  // Apply saved theme and text size before render to avoid a flash of the defaults.
  // Both are validated against the known sets so a stale or hand-edited
  // localStorage value falls back cleanly instead of leaving the pickers blank.
  // Keep in sync with the [data-theme=...] blocks and the picker's <option>s.
  var THEMES = ['auto','midnight','dark','light','sepia']; // retired themes fall back to midnight below
  var SIZES = ['0.85','1','1.15','1.3','1.5'];
  var t = localStorage.getItem('dashboard-theme');
  var s = localStorage.getItem('dashboard-textsize');
  document.documentElement.setAttribute('data-theme', THEMES.indexOf(t) > -1 ? t : 'midnight');
  document.documentElement.style.setProperty('--scale', SIZES.indexOf(s) > -1 ? s : '1');
</script>
<script src="data/data-daily-news-briefing.js"></script>
<script src="data/data-ios-beta-weekly-check.js"></script>
<script src="data/data-buffalo-weekend-events.js"></script>
<script src="data/data-streaming-weekly-digest.js"></script>
<script src="data/data-daily-claude-news.js"></script>
<script src="data/data-iphone-rumors-daily.js"></script>
<script src="data/data-macos-beta-weekly-check.js"></script>
<script src="data/data-glp1-daily-news.js"></script>
<!-- The palette, LINKED — the pack's generated file, before the page's own
     <style> so the app tokens below can build on it. -->
<link rel="stylesheet" href="theme.css">
<style>
  /* ---- Themes ---- */
  /* ── Palette ──────────────────────────────────────────────────────────────
     LINKED as `theme.css` in the <head> — the pack's generated file, copied
     byte-for-byte, the same one every app in the family reads. Until
     2026-08-18 all four themes were transcribed into this block under this
     page's own names; both are gone, so this file and the pack can be diffed
     directly. The names that simply moved: text/heading→text-primary,
     muted→text-muted, card-bg→surface, header-hover→surface-alt,
     chip-stale-text→text-muted, chip-stale-bg→surface-alt, faint→text-hint,
     ctl-border→border-control. TWO SWAPPED PLACES and are the reason this was
     not a blind rename: this page's old `--border` (#374163) is the pack's
     --border-strong, and its old `--divider` is the pack's --border.
     Linking without catching that would have quietly lightened every card edge
     and darkened every divider.

     One token still DIVERGES from a straight pack mapping, kept as an app token
     and written in terms of pack tokens so the divergence is visible rather
     than a hex nobody can trace:
       • --body-text is text-SECONDARY in the dark themes but text-PRIMARY in
         light and sepia — this page runs body copy at full strength there.

     SEPIA used to be a second one: --chip-text/--chip-bg/--link were the ERROR
     red while every other theme used the accent, because sepia's accent IS its
     text colour (#3a3020 both) — the theme is monochrome by design, so "use the
     accent" means "look exactly like body text". Settled 2026-08-19 in favour of
     the accent anyway, and the reasons are worth keeping so nobody re-reds it:
     this page has no error states at all, so the red signalled nothing; only two
     things read --link (task-output links, which are underlined regardless, and
     the focus ring), so no link became unidentifiable; the badge stopped reading
     as an alert on every card; and all three contrast figures improved — link
     8.1→11.9, focus ring 7.4→10.8, badge text on its fill 6.0→9.4.
  ─────────────────────────────────────────────────────────────────────────── */
  :root { --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  :root, [data-theme="midnight"] {
    --body-text: var(--text-secondary);
    --chip-text: var(--accent); --chip-bg: var(--accent-bg);
    --link: var(--accent);
    --select-chevron: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' fill='none' stroke='%23838cab' stroke-width='1.5'/></svg>");
  }
  [data-theme="dark"] {
    --body-text: var(--text-secondary);
    --chip-text: var(--accent); --chip-bg: var(--accent-bg);
    --link: var(--accent);
    --select-chevron: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' fill='none' stroke='%239396a3' stroke-width='1.5'/></svg>");
  }
  [data-theme="light"] {
    --body-text: var(--text-primary);
    --chip-text: var(--accent); --chip-bg: var(--accent-bg);
    --link: var(--accent);
    --select-chevron: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' fill='none' stroke='%23656562' stroke-width='1.5'/></svg>");
  }
  [data-theme="sepia"] {
    --body-text: var(--text-primary);
    --chip-text: var(--accent); --chip-bg: var(--accent-bg);
    --link: var(--accent);
    --select-chevron: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' fill='none' stroke='%236a5e46' stroke-width='1.5'/></svg>");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* `--chrome-h` is the app family's one height for everything in the header row —
     a native <select> ignores line-height, so it sizes shorter than a button with
     identical padding, and pinning both is the only way to keep the row even.
     30px is the siblings' number, but it is SCALED here and nowhere else: this
     page has a text-size preference the others do not, and a control fixed at
     30px would clip its own label at XL and XXL. */
  :root { --scale: 1; --chrome-h: calc(30px * var(--scale)); }
  /* `color-scheme` tells the browser which way round the page is, so the parts of
     a control it draws itself — the select chevrons this page overrides, but also
     scrollbars and any focus ring it supplies — follow the theme instead of always
     being drawn light. It is not one of our colours and overrides nothing in the
     pack. The pairing follows the PALETTE, not the theme's name: sepia is a warm
     LIGHT theme and takes `light`. Every app in the family carries this block. */
  :root, [data-theme="midnight"] { color-scheme: dark; }
  [data-theme="dark"]  { color-scheme: dark; }
  [data-theme="light"] { color-scheme: light; }
  /* Auto has no palette of its own — theme.css resolves it to Light or, under
     prefers-color-scheme: dark, to Midnight. `light dark` is the honest answer: the
     page works either way, and the browser should draw its own controls to match the
     system, which is what the palette above it is doing. */
  [data-theme="auto"]  { color-scheme: light dark; }
  [data-theme="sepia"] { color-scheme: light; }
  /* No side or top padding on the body any more — the header is a full-width bar
     that has to reach the window edges, so the gutters moved onto the bar's own
     row and onto `.wrap` below it. */
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font); min-height: 100vh; transition: background 0.15s, color 0.15s; }
  /* The 28px page title this page opened with is gone: it is a header bar now, and
     the family's is one line of 17px with the strapline beside it. */
  /* The mark from the browser tab, worn beside the title. Sized in em rather than
     px so it follows the text-size preference the whole heading already scales
     with — a fixed icon looks lost beside the XXL heading. The width/height
     attributes on the element are the normal-size equivalent, so the row is laid
     out before the icon arrives. It sits in the heading's own flow; making h1 a
     flex row would stop the title wrapping on a narrow screen. */
  /* Sized in em rather than px so it follows the text-size preference the heading
     already scales with — a fixed 22px mark looks lost beside the XXL heading, and
     this is the one page in the family with that setting. The width/height
     attributes on the element are the normal-size equivalent, so the row is laid
     out before the icon arrives. */
  .brand img { width: 1.3em; height: 1.3em; vertical-align: -.22em; margin-right: 9px; }
  .subtitle { color: var(--text-muted); font-size: calc(14px * var(--scale)); margin-bottom: 36px; }
  .grid { display: flex; flex-direction: column; gap: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; }
  /* The header is a real <button> (inside an <h2>) so it is keyboard-reachable
     and announced as an expandable control. These rules undo the UA button
     styling; the layout below is unchanged. */
  .card-header-h { font-size: inherit; font-weight: inherit; }
  .card-header { width: 100%; font: inherit; color: inherit; background: none; border: none; border-bottom: 1px solid transparent; text-align: left;
                 padding: 18px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; transition: background 0.12s; }
  .card-header:hover { background: var(--surface-alt); }
  .card-header:focus-visible { outline: 2px solid var(--link); outline-offset: -3px; }
  .card.expanded .card-header { border-bottom-color: var(--border); padding-bottom: 14px; }
  .card-title { display: block; font-size: calc(16px * var(--scale)); font-weight: 600; color: var(--text-primary); }
  .chevron { display: inline-block; width: 12px; color: var(--text-muted); margin-right: 8px; transition: transform 0.15s; font-size: calc(11px * var(--scale)); }
  .card.expanded .chevron { transform: rotate(90deg); }
  .card-headline { display: block; }
  .card-updated { display: block; text-align: right; flex-shrink: 0; }
  .updated-ago { font-size: calc(12px * var(--scale)); color: var(--chip-text); background: var(--chip-bg); border-radius: 6px; padding: 3px 8px; white-space: nowrap; display: inline-block; }
  .updated-ago.stale { color: var(--text-muted); background: var(--surface-alt); }
  .updated-full { display: block; font-size: calc(12px * var(--scale)); color: var(--text-hint); margin-top: 5px; white-space: nowrap; }
  .card-meta { display: block; font-size: calc(12px * var(--scale)); color: var(--text-muted); margin-top: 4px; font-weight: 400; }
  /* Same size/token as .updated-full: the two are a matched pair — when the
     card is due on the left, when it last ran on the right. */
  .card-schedule { display: block; font-size: calc(12px * var(--scale)); color: var(--text-hint); margin-top: 5px; font-weight: 400; }
  .sched-icon { margin-right: 6px; }

  /* ── One row, once there is room ────────────────────────────────────────────
     The card header is two stacks — title/description/schedule on the left, the
     updated badge and its timestamp on the right — pushed apart by
     `space-between`. On a narrow window that is right. On a wide one it left a
     hand's width of empty card between them while every line stayed squeezed into
     its own column, which is the shape a phone layout takes on a desktop.

     `display: contents` on the two wrappers, so their children become direct flex
     items of the header and can be spread across it individually. The wrappers
     are plain <span>s carrying no meaning of their own — they exist to stack
     things — so dissolving them costs the accessibility tree nothing.

     The DESCRIPTION is the only flexible one: it is the sentence, and it is the
     one that should absorb whatever the window has spare. Everything else is a
     fixed phrase — a title, a schedule, a badge, a timestamp — and each gets its
     natural width. The timestamp is pushed to the far edge with an auto margin
     rather than another `space-between`, so the gap lands in ONE place instead of
     four, which is what keeps the row reading left to right.

     Baseline alignment, not centre: five pieces at three different sizes sit on
     one line only if they share a baseline.

     1100px, not the breakpoint the rest of the page uses: this is about whether
     five things fit across a card, and below it they simply do not. */
  @media (min-width: 1100px) {
    .card-headline, .card-updated { display: contents; }
    .card-header { align-items: baseline; gap: 20px; }
    .card-title { flex: 0 0 auto; }
    /* The stacked layout's top margins are what separated these as rows; on one
       line they would just push each item off the baseline. */
    .card-meta { flex: 1 1 auto; margin-top: 0; min-width: 0; }
    .card-schedule { flex: 0 0 auto; margin-top: 0; }
    .updated-ago { flex: 0 0 auto; }
    .updated-full { flex: 0 0 auto; margin-top: 0; margin-left: auto; }
  }
  .card-body { display: none; padding: 20px; font-size: calc(14px * var(--scale)); line-height: 1.7; color: var(--body-text); white-space: pre-wrap; word-break: break-word; }
  .card.expanded .card-body { display: block; }
  .empty { color: var(--text-hint); font-style: italic; }
  /* Authorship line under the cards. Muted like .subtitle — it is a statement of
     provenance, not something to read before the dashboard itself. */
  /* ── Skip to content ────────────────────────────────────────────────────
     Visually gone until it takes focus, then the first thing on the page.
     Without it a keyboard or screen-reader user tabs the whole header — brand,
     two pickers, Refresh — on every load before reaching a single card. Every
     sibling app has had one since 2026-08-20; this page was the last without.
     Uses the pack's own tokens, so it follows the theme like everything else. */
  .skip { position: absolute; left: -9999px; top: 0; z-index: 100; }
  .skip:focus {
    /* FIXED, not absolute: absolute positions against the document, so a reader
       who shift-tabs back from halfway down the page would send the link to the
       top of the document and the browser would scroll the whole page to follow
       it. Fixed puts it at the top of the VIEWPORT, where it was aimed. */
    position: fixed;
    left: 8px; top: 8px; padding: 8px 14px;
    background: var(--surface); color: var(--text-primary);
    border: 2px solid var(--focus-border); border-radius: var(--radius-sm);
    text-decoration: none; font-weight: 600;
  }
  /* Focus lands on <main id="grid" tabindex="-1">, which must not then draw a
     focus ring around the whole card grid — the link itself already showed
     where focus went. */
  main:focus { outline: none; }

  .site-footer { color: var(--text-muted); font-size: calc(12px * var(--scale)); margin-top: 36px; }
  .site-footer a { color: var(--text-muted); }
  .site-footer a:hover { color: var(--text-primary); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* Citation links sit inside body text, where colour alone does not separate
     them from the surrounding prose (WCAG 1.4.1) — only the Light theme clears
     3:1 against --body-text. Underlining them makes the cue non-colour-based
     in every theme; hover thickens it. */
  .card-body a { text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .card-body a:hover { text-decoration-thickness: 2px; }
  /* ── Overdue ───────────────────────────────────────────────────────────────
     A THIRD badge state, added 2026-08-22 with the schedule-aware check in the
     script. The muted `.stale` chip stays what it always was — a card with no
     readable timestamp — and this one is a card that HAS one and has missed its
     own slot.

     `--warn` on `--warn-bg` is the theme pack's own gated pair (its contrast
     script checks every status colour against its tint at 4.5:1), so this
     introduces no colour of its own. Amber rather than the error red for two
     reasons: a late task is not an error, and amber sits off the red/green axis,
     which is the one Charles cannot read. The word "overdue" is written into the
     chip as well, so the state never depends on the colour being seen. */
  .updated-ago.overdue { color: var(--warn); background: var(--warn-bg); }

  /* ── Search ────────────────────────────────────────────────────────────────
     The highlight. Same gated pair as the overdue chip — the two never mean the
     same thing but they never share a place on the card either: one is a pill in
     the header, the other is a word inside the body text. */
  mark.hit { background: var(--warn-bg); color: var(--warn); border-radius: 3px; padding: 0 1px; }
  /* Filtered-out cards. The UA sheet already does this; saying it here means a
     later `display:` on .card cannot quietly bring them back. */
  .card[hidden] { display: none; }
  /* The result count. Empty rather than hidden between searches — see the note
     on the element — so `:empty` is what keeps it out of the layout. */
  .searchnote { margin: 0; font-size: calc(13px * var(--scale)); color: var(--text-muted); }
  .searchnote:empty { display: none; }

  /* ── The page-age notice ───────────────────────────────────────────────────
     Sits in the card flow as the first item, so it arrives where the eye already
     is. The warn-coloured edge is the only colour on it: it is a nudge, not a
     failure. */
  .notice { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            background: var(--surface); border: 1px solid var(--border-strong);
            border-left: 3px solid var(--warn); border-radius: 12px;
            padding: 12px 16px; font-size: calc(13px * var(--scale)); color: var(--text-secondary); }
  /* `display: flex` beats the UA sheet's [hidden] rule, so it has to be said. */
  .notice[hidden] { display: none; }
  .notice b { color: var(--text-primary); font-weight: 600; }

  /* ── Per-card actions ──────────────────────────────────────────────────────
     A footer row on the card, visible only while it is open — the buttons are
     about the content, and there is no content on screen to copy or print until
     the card is expanded. */
  .card-actions { display: none; gap: 8px; padding: 0 20px 16px; flex-wrap: wrap; }
  .card.expanded .card-actions { display: flex; }

  /* ── Header ────────────────────────────────────────────────────────────────
     The app family's shape: a bar the full width of the window that STAYS at the
     top of the screen, with the row inside it held to the same gutters as the
     content below. It was an ordinary block that scrolled away, taking the text
     size and theme pickers with it — on a dashboard you scroll to read, which is
     the case those two controls are most wanted in.

     Sticky rather than fixed: fixed leaves the flow and the page then has to be
     padded by hand to make room, which goes wrong the moment the row wraps on a
     phone. z-index 20 is the siblings' number. */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border-strong);
    padding: 10px 0; margin-bottom: 24px;
  }
  /* 16px, the family's gutter — the bar and the content take the SAME number, or
     the brand stops lining up with the left edge of the first card. This page
     opened at 24px, carried over from the body padding it used to have, which
     left its header row visibly inset compared with the sibling apps: their
     controls reach to 16px of the window edge and these stopped at 24px. */
  .headbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 16px; }
  .wrap { padding: 0 16px 32px; }
  /* The family's brand line: mark, name, then the strapline muted behind a middle
     dot. The auto right margin pushes the controls to the far edge. It is NOT a
     flex row — the mark sits in the heading's own text flow, so a strapline that
     wraps on a phone runs on below the name rather than being laid out as a
     second narrow column beside it. */
  .brand { font-size: calc(17px * var(--scale)); font-weight: 600; margin: 0 auto 0 0;
           color: var(--text-primary); letter-spacing: -0.01em; }
  .brand span { color: var(--text-muted); font-weight: 400; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  /* The family's button: `--surface-alt` on `--border-strong` at 6px, darkening its
     border on hover. It was the same fill on `--border-control` with muted text —
     close, but a shade quieter than the same row in the sibling apps, and sized
     at 12px against their 13. The height is the shared `--chrome-h`, which is
     scaled here (see the token) because this page's text size is a preference. */
  .ctl { font-size: calc(13px * var(--scale)); color: var(--text-primary); background: var(--surface-alt);
         border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 10px;
         min-height: var(--chrome-h); cursor: pointer; font-family: var(--font); }
  .ctl:hover { border-color: var(--text-muted); }
  /* The same control one step down, for the card's own buttons and the notice —
     they sit inside the content rather than in the chrome, so they should not
     compete with the card title. The touch height is unchanged. */
  .ctl.small { font-size: calc(12px * var(--scale)); padding: 3px 9px; }
  .ctl:disabled { opacity: .5; cursor: default; }
  .ctl:disabled:hover { border-color: var(--border-strong); }
  /* An input is not a button: it takes a text cursor, and unlike the pickers
     beside it there is no label inside to give it a width.

     A FIXED width, deliberately, and not `flex: 1 1 170px` — a flex BASIS a few
     pixels wider than the field's own content width makes the row's intrinsic
     width and its line-breaking disagree, and the header bar wrapped Refresh
     onto a second row at 1280px over a 3px difference. Width and flex base are
     the same number this way. It still shrinks on a narrow window (flex-shrink
     is 1 by default) down to the min, and wraps below that like everything
     else in the row. */
  input.ctl { cursor: text; width: 210px; min-width: 120px; box-sizing: border-box; }
  input.ctl::placeholder { color: var(--text-hint); opacity: 1; }
  .ctl:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 2px; }
  select.ctl { -webkit-appearance: none; appearance: none; padding-right: 26px; background-image: var(--select-chevron); background-repeat: no-repeat; background-position: right 9px center; }

  /* ---- Narrow screens: let the header and card headers wrap instead of squeezing/clipping ---- */
  @media (max-width: 640px) {
    /* The gutter is 16px everywhere now, so there is nothing to narrow here —
       and `body` has no padding of its own any more, nor an `h1` or a
       `.header-row` to restyle. All four rules went with the header rewrite. */
    .grid { gap: 16px; }
    /* Two control rows on a phone, which is what this bar had before it gained
       a search box and an Expand all — a third row of sticky header is a lot of
       a phone screen to give up. The search stretches into whatever the row has
       spare beside Expand all rather than sitting at its wide-window width with
       a hand's width of empty bar beside it; the three that were here already
       stay together on the row below. */
    .controls { width: 100%; }
    input.ctl { flex: 1 1 auto; width: auto; min-width: 120px; }
    .card-header { flex-wrap: wrap; }
    .card-updated { width: 100%; text-align: left; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .updated-full { margin-top: 0; }
    .card-body { padding: 16px; }
    .card-actions { padding: 0 16px 14px; }
  }

  /* ── Print ─────────────────────────────────────────────────────────────────
     Printing this page means printing the OUTPUT, so every card body is opened
     for the printer whatever the screen is showing, and the chrome that cannot
     be used on paper comes off. `.printing-one` is set by a card's own Print
     button for the length of the dialog: same sheet, one card.

     Deliberately black on white rather than the theme: a midnight card is a
     page of ink, and no browser prints backgrounds by default anyway — which
     would have left `--text-secondary` body copy on the paper's own white. */
  @media print {
    header, .skip, .notice, .searchnote, .card-actions, .site-footer, .chevron { display: none !important; }
    body { background: #fff; color: #000; }
    .wrap { padding: 0; }
    .grid { gap: 16px; }
    .card { border: 1px solid #999; break-inside: auto; }
    .card-body { display: block !important; color: #000; }
    .card-header { border-bottom: 1px solid #999; }
    .card-title, .card-meta, .card-schedule, .updated-ago, .updated-full { color: #000; }
    .updated-ago { background: none; padding: 0; }
    mark.hit { background: none; color: #000; font-weight: 700; }
    body.printing-one .card:not(.print-target) { display: none; }
  }

  /* Respect the OS "reduce motion" setting. */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<a class="skip" href="#grid">Skip to content</a>
<header>
  <div class="headbar">
    <!-- ?v= is not decoration: a browser holds on to a favicon for a long time, and
         without it this would keep showing whatever icon it cached the first time.
         Bump it on both references when make_favicon.py is re-run. -->
    <h1 class="brand"><img src="favicon.ico?v=1" width="23" height="23" alt=""
      >Task&nbsp;Dashboard <span>&middot; Charlie&rsquo;s Epic Information Roundup</span></h1>
    <div class="controls">
      <!-- Search first in the row because it is the one control that changes what
           the page SHOWS; the two pickers change how it looks and Refresh reloads
           it. type="search" gets the browser's own clear button, and the theme
           pack already floors it at 16px on a touch screen (iOS zooms the page in
           on any focused field under that). -->
      <input class="ctl" id="search" type="search" autocomplete="off"
             placeholder="Search all tasks" aria-label="Search every task&rsquo;s output" aria-describedby="searchnote">
      <!-- The state lives in the LABEL, not in aria-expanded: this button controls
           eight disclosures rather than one, and "Expand all, collapsed" would be
           a plain lie on a page where seven of the eight are already open. The
           label always names what the press will do. -->
      <button class="ctl" type="button" id="expandall"><span aria-hidden="true">&#8661;</span> <span class="label">Expand all</span></button>
      <select class="ctl" id="textsize" aria-label="Text size">

        <option value="1">🔠 Normal</option>
        <option value="1.15">🔠 Large</option>
        <option value="1.3">🔠 XL</option>
        <option value="1.5">🔠 XXL</option>

        <option value="auto">◐ Auto</option>
        <option value="dark">☾ Dark</option>
        <option value="light">☀ Light</option>
        <!-- selected, because the boot script in <head> has ALREADY applied
             midnight by the time this row paints. Without it the browser
             pre-selects the first option and the picker reads "Dark" over a
             midnight page until the script at the foot sets .value — the same
             reason every sibling app writes this attribute in. -->
        <option value="midnight" selected>✦ Midnight</option>
        <option value="sepia">📜 Sepia</option>
      </select>
      <!-- The glyph is a plain text character, aria-hidden, in front of the word —
           the family's header pattern. It was already carried inline in the label,
           where a screen reader read it out as part of the button's name. -->
      <button class="ctl" onclick="location.reload()"><span aria-hidden="true">↻</span> Refresh</button>
    </div>
  </div>
</header>

<div class="wrap">
<noscript>
  <p>This dashboard needs JavaScript to display your scheduled-task output.</p>
</noscript>
<main class="grid" id="grid" tabindex="-1">
  <!-- Both live INSIDE the main landmark, so the skip link lands above them
       rather than past them, and the cards render after them. -->
  <!-- This page has no service worker and no network of its own, so it cannot
       ask whether newer output exists. What it can say is how long ago this copy
       was loaded, which is the thing a tab left open overnight hides. -->
  <div class="notice" id="agenotice" hidden>
    <span>This page was loaded <b id="agenotice-age">an hour ago</b> and does not update itself.</span>
    <button class="ctl small" type="button" id="agenotice-refresh"><span aria-hidden="true">&#8635;</span> Refresh</button>
  </div>
  <!-- A live region that is EMPTY rather than hidden: a role="status" toggled
       out of `hidden` is announced unreliably, an empty one that gains text is
       not. `:empty` keeps it out of the layout in the meantime. -->
  <p class="searchnote" id="searchnote" role="status"></p>
</main>
<!-- Two links, not one: "independent personal project" points at NOTICE and

<script>
// ---- Theme picker ----
/* Keeps the installed app window's title bar with the theme. Read back out of the
   pack's `--bg` rather than listed here, so a palette change in the theme pack
   carries across without a second place to remember it. Only an installed window
   and mobile browser chrome read it; in an ordinary tab it does nothing. Same
   function, same reasoning, in every sibling app. */
function applyThemeColor() {
  const bar = document.querySelector('meta[name="theme-color"]');
  const bg = getComputedStyle(document.documentElement)
    .getPropertyValue('--bg').trim();
  if (bar && bg) bar.setAttribute('content', bg);
}
applyThemeColor();
/* On Auto the palette can change while the page is open — the reader switches their
   phone to dark at sunset and theme.css follows on its own. The theme-color meta tag
   does not: it was written once from the computed --bg, and it is what paints an
   installed window's title bar and Android's address bar. This re-reads it, and only
   it; the theme itself is still resolved entirely by CSS. */
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (document.documentElement.getAttribute('data-theme') === 'auto') applyThemeColor();
});

const themeSelect = document.getElementById('theme');
themeSelect.value = document.documentElement.getAttribute('data-theme');
themeSelect.addEventListener('change', () => {
  document.documentElement.setAttribute('data-theme', themeSelect.value);
  localStorage.setItem('dashboard-theme', themeSelect.value);
  applyThemeColor();
});

// ---- Text size picker ----
const sizeSelect = document.getElementById('textsize');
const savedSize = localStorage.getItem('dashboard-textsize');
sizeSelect.value = SIZES.indexOf(savedSize) > -1 ? savedSize : '1';
sizeSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--scale', sizeSelect.value);
  localStorage.setItem('dashboard-textsize', sizeSelect.value);
});

const TASKS = [
  {
    id: 'daily-news-briefing',
    title: '🗞️ Daily News Briefing',
    schedule: 'Every day at 1:45 AM',
    description: 'Local Pendleton/Buffalo/WNY, US, and global headlines'
  },
  {
    id: 'ios-beta-weekly-check',
    title: '📱 iOS Beta Check',
    schedule: 'Every Wednesday at 12:45 AM',
    description: 'Go/no-go recommendation for iPhone 15 Pro Max'
  },
  {
    id: 'buffalo-weekend-events',
    title: '🎉 Buffalo Weekend Events',
    schedule: 'Every Friday at 12:00 AM',
    description: 'Free & paid events in and around Buffalo'
  },
  {
    id: 'streaming-weekly-digest',
    title: '📺 Streaming Digest',
    schedule: 'Every Friday at 12:15 AM',
    description: 'New on Apple TV+, Crunchyroll, and Prime Video'
  },
  {
    id: 'daily-claude-news',
    title: '🤖 Claude and Other AI News',
    schedule: 'Every day at 1:30 AM',
    description: 'Latest Anthropic, Claude, and AI industry news from the past 24 hours'
  },
  {
    id: 'iphone-rumors-daily',
    title: '📲 iPhone Rumors',
    schedule: 'Every Monday at 1:00 AM',
    description: 'Next-iPhone rumor roundup, grouped by confidence level'
  },
  {
    id: 'macos-beta-weekly-check',
    title: '💻 macOS Beta Check',
    schedule: 'Every Wednesday at 12:30 AM',
    description: 'Go/no-go recommendation for Apple Silicon MacBook Pro'
  },
  {
    id: 'glp1-daily-news',
    title: '💉 GLP-1 News',
    schedule: 'Every Saturday at 1:15 AM',
    description: 'GLP-1 drug news from the past week — trials, FDA actions, and industry developments'
  }
];

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ESC[c]);
}

// Task content is written by scheduled tasks that summarise pages from the open
// web, so it is untrusted and must never reach innerHTML unescaped. Everything
// is escaped first, then a small allowlist is re-enabled:
//   * bare <strong>/<em>/<b>/<i>/<br> with no attributes (the data uses <strong>)
//   * [label](http(s)://...) markdown links
// Because the URL is already escaped when it is placed in the href, a quote
// inside it becomes &quot; and cannot break out to forge a new attribute.
// A tag carrying attributes (e.g. <strong onclick=...>) never matches the
// allowlist and stays escaped as visible text.
function formatContent(text) {
  if (typeof text !== 'string') return '';
  let out = escapeHtml(text);
  out = out.replace(/&lt;(\/?)(strong|em|b|i|br)\s*\/?&gt;/gi,
    (m, slash, tag) => `<${slash}${tag.toLowerCase()}>`);
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    (m, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
  return out;
}

function parseStamp(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  return Number.isFinite(t) ? t : null;
}

// Reports the distance from now in the largest sensible unit. A timestamp ahead
// of the clock is labelled "from now" rather than silently reading as fresh,
// so a skewed clock or a bad mtime is visible instead of hidden.
function timeAgo(t) {
  const signed = Date.now() - t;
  const future = signed < -60000;
  const m = Math.floor(Math.abs(signed) / 60000);
  if (m < 1) return 'just now';
  let out;
  if (m < 60) out = `${m}m`;
  else {
    const h = Math.floor(m / 60);
    out = h < 24 ? `${h}h` : `${Math.floor(h / 24)}d`;
  }
  return future ? `${out} from now` : `${out} ago`;
}

/* ── Cards ──────────────────────────────────────────────────────────────────
   Everything below works off ONE array of card entries — the element, its
   buttons, the timestamp chip and a lowercased haystack of everything the card
   says. Five features read the same set (search, expand all, the permalink
   hash, the ticking timestamps, per-card copy and print), and each of them
   re-deriving it from the DOM would be five slightly different answers to the
   same question. */
const grid = document.getElementById('grid');
const data = window.taskData || {};
const cards = [];

TASKS.sort((a, b) => (parseStamp(data[b.id]?.updatedAt) || 0) - (parseStamp(data[a.id]?.updatedAt) || 0));

const HOUR_MS = 60 * 60 * 1000;
const DAY_MS = 24 * HOUR_MS;

/* How often a task is EXPECTED to run, read from the same schedule string the
   card already shows — so there is no second place to keep it in step.

   Until 2026-08-22 staleness was ONE FLAT 8-DAY THRESHOLD for every card, which
   only ever caught the weeklies: the daily briefing could stop for three days
   and still wear a perfectly ordinary badge, while the README claimed a task
   that had missed its slot was visible at a glance.

   Returns null for a wording it does not know. That is deliberate and the
   fallback below is the old flat rule: a schedule phrased in some new way must
   degrade to what this page did yesterday, never to calling a healthy task
   late. */
function expectedIntervalMs(schedule) {
  if (typeof schedule !== 'string') return null;
  const s = schedule.toLowerCase();
  const hours = s.match(/\bevery\s+(\d+)\s*hours?\b/);
  if (hours) return Number(hours[1]) * HOUR_MS;
  const days = s.match(/\bevery\s+(\d+)\s*days?\b/);
  if (days) return Number(days[1]) * DAY_MS;
  if (/\b(every day|daily)\b/.test(s)) return DAY_MS;
  if (/\bevery\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?\b/.test(s)) return 7 * DAY_MS;
  if (/\b(every week|weekly)\b/.test(s)) return 7 * DAY_MS;
  return null;
}

/* The grace on top of that interval — enough to absorb a task that starts late
   and the hourly push that carries its output here, without waiting a whole
   extra cycle before anything is said. Six hours, or the interval itself if that
   is shorter: a fixed six would be most of a day's slack for an hourly task,
   and a PROPORTIONAL grace would be the opposite mistake, giving a weekly task
   most of a day before anything was said about a slot it had already missed.

   So: a task reads overdue about six hours after the slot it missed. */
function overdueAfterMs(schedule) {
  const interval = expectedIntervalMs(schedule);
  if (interval === null) return 8 * DAY_MS;
  return interval + Math.min(6 * HOUR_MS, interval);
}

/* Three states, not two: a card with no readable stamp is UNKNOWN and stays the
   muted chip it always was, while a card that has a stamp and has missed its own
   slot is OVERDUE and says so. They are different problems — one is a task that
   has never run or a data file that is wrong, the other is a task that stopped. */
function stampState(stamp, schedule) {
  if (stamp === null) return 'unknown';
  return Date.now() - stamp > overdueAfterMs(schedule) ? 'overdue' : 'fresh';
}

/* Written on every tick, not once at render. The label is relative ("Updated 5m
   ago"), and it used to be computed exactly once — so a tab left open overnight
   went on saying "5m ago" until somebody reloaded it. That is the same wrong
   answer this page refuses a service worker to avoid, arriving through a
   different door. */
function paintStamp(entry) {
  const state = stampState(entry.stamp, entry.task.schedule);
  const base = entry.stamp !== null ? `Updated ${timeAgo(entry.stamp)}`
             : entry.badStamp ? 'Timestamp unreadable' : 'No data yet';
  entry.ago.textContent = state === 'overdue' ? `${base} · overdue` : base;
  entry.ago.classList.toggle('stale', state === 'unknown');
  entry.ago.classList.toggle('overdue', state === 'overdue');
}

/* Bring the top of an expanded card to just under the header bar — NOT to the
   top of the viewport, which is where the bar is. The header went sticky on
   2026-08-21 and this scroll did not know about it, so opening a card slid its
   own title underneath the bar and you landed on the second line of the
   description.

   MEASURED rather than assumed: the bar's height moves with the text-size
   preference and wraps to two or three rows on a narrow window, so a constant
   would be wrong in most of the cases that matter. Read at the moment of the
   scroll, which is when it is correct. */
function scrollCardIntoView(card) {
  requestAnimationFrame(() => {
    const bar = document.querySelector('header');
    const clearance = (bar ? bar.getBoundingClientRect().height : 0) + 16;
    const top = card.getBoundingClientRect().top + window.scrollY - clearance;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: Math.max(0, top), behavior: reduce ? 'auto' : 'smooth' });
  });
}

function isOpen(entry) { return entry.card.classList.contains('expanded'); }
function visibleCards() { return cards.filter(e => !e.card.hidden); }
function openCards() { return cards.filter(isOpen); }

function setOpen(entry, open, scroll) {
  entry.card.classList.toggle('expanded', open);
  entry.btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open && scroll) scrollCardIntoView(entry.card);
}

function collapseAll() { cards.forEach(e => setOpen(e, false)); }

/* ── Highlighting ───────────────────────────────────────────────────────────
   Marks are put in and taken out through TEXT NODES, never by rewriting a
   card's innerHTML. Two reasons, and both matter here: the body's markup is the
   output of formatContent — the sanitizer — and re-parsing its own output on
   every keystroke is a round trip this page has no reason to take; and the card
   header carries the button every other feature has listeners on, which an
   innerHTML rewrite would silently throw away.

   The needle is compared with indexOf, not a RegExp, so a search for "a+b" or
   "(1)" is a search for those characters and nothing has to be escaped. */
function markMatches(root, needle) {
  if (!root || !needle) return 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  let hits = 0;
  nodes.forEach(node => {
    const text = node.nodeValue, lower = text.toLowerCase();
    let at = 0, i = lower.indexOf(needle);
    if (i === -1) return;
    const frag = document.createDocumentFragment();
    while (i !== -1) {
      if (i > at) frag.appendChild(document.createTextNode(text.slice(at, i)));
      const m = document.createElement('mark');
      m.className = 'hit';
      m.textContent = text.slice(i, i + needle.length);
      frag.appendChild(m);
      hits++;
      at = i + needle.length;
      i = lower.indexOf(needle, at);
    }
    if (at < text.length) frag.appendChild(document.createTextNode(text.slice(at)));
    node.parentNode.replaceChild(frag, node);
  });
  return hits;
}

/* normalize() is not tidiness: without it every cleared search leaves the text
   split at the old match boundaries, and the next search cannot match across a
   seam it created itself. */
function clearMarks(root) {
  if (!root) return;
  root.querySelectorAll('mark.hit').forEach(m => {
    m.replaceWith(document.createTextNode(m.textContent));
  });
  root.normalize();
}

/* ── Cards ──────────────────────────────────────────────────────────────── */
TASKS.forEach(task => {
  // One malformed data file must not blank the rest of the dashboard, so each
  // card renders independently and failures degrade to a visible notice.
  try {
    const d = data[task.id];
    const stamp = parseStamp(d?.updatedAt);
    const fullLabel = stamp !== null ? new Date(stamp).toLocaleString()
                    : d?.updatedAt ? String(d.updatedAt) : 'waiting for first run';
    const raw = typeof d?.content === 'string' ? d.content : '';
    const bodyHtml = raw.trim() ? formatContent(raw)
                   : '<span class="empty">No output yet — waiting for first run.</span>';
    const bodyId = `body-${task.id}`;
    const titleId = `title-${task.id}`;

    const card = document.createElement('div');
    card.className = 'card';
    // The header is a <button> inside an <h2>: keyboard-focusable, announced as
    // an expandable control, and Enter/Space work natively. Every value that
    // can carry task output is escaped; the ids and the class names are built
    // from the hard-coded TASKS constants, trusted by construction.
    card.innerHTML = `
      <h2 class="card-header-h">
        <button type="button" class="card-header" aria-expanded="false" aria-controls="${bodyId}">
          <span class="card-headline">
            <span class="card-title" id="${titleId}"><span class="chevron" aria-hidden="true">▶</span>${escapeHtml(task.title)}</span>
            <span class="card-meta">${escapeHtml(task.description)}</span>
            ${task.schedule ? `<span class="card-schedule"><span class="sched-icon" aria-hidden="true">🕐</span>${escapeHtml(task.schedule)}</span>` : ''}
          </span>
          <span class="card-updated">
            <span class="updated-ago"></span>
            <span class="updated-full">${escapeHtml(fullLabel)}</span>
          </span>
        </button>
      </h2>
      <div class="card-body" id="${bodyId}" role="region" aria-labelledby="${titleId}">${bodyHtml}</div>
      <div class="card-actions">
        <button type="button" class="ctl small act-copy"><span aria-hidden="true">📋</span> <span class="label">Copy</span></button>
        <button type="button" class="ctl small act-print"><span aria-hidden="true">🖨</span> <span class="label">Print</span></button>
      </div>
    `;

    const entry = {
      task, card,
      btn: card.querySelector('.card-header'),
      ago: card.querySelector('.updated-ago'),
      full: card.querySelector('.updated-full'),
      body: card.querySelector('.card-body'),
      title: card.querySelector('.card-title'),
      meta: card.querySelector('.card-meta'),
      stamp,
      badStamp: stamp === null && !!d?.updatedAt,
      raw,
      // Title and description included on purpose: searching for "beta" should
      // find the two beta-check cards even on a week when neither ran.
      haystack: `${task.title} ${task.description} ${task.schedule || ''} ${raw}`.toLowerCase()
    };
    paintStamp(entry);

    entry.btn.addEventListener('click', () => {
      /* One card at a time is this page's habit — but only while ONE is open.
         Search and Expand all both leave several open, and closing the rest
         because you clicked one of them would undo what you just asked for. */
      const wasOpen = isOpen(entry);
      if (openCards().length <= 1) collapseAll();
      setOpen(entry, !wasOpen, !wasOpen);
      syncHash();
      syncExpandBtn();
    });

    card.querySelector('.act-copy').addEventListener('click', ev => copyCard(entry, ev.currentTarget));
    card.querySelector('.act-print').addEventListener('click', () => printCard(entry));

    cards.push(entry);
    grid.appendChild(card);
  } catch (err) {
    console.error(`Failed to render task "${task.id}":`, err);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="card-body" style="display:block">
      <span class="empty">${escapeHtml(task.title)} — could not be displayed (malformed data file).</span>
    </div>`;
    grid.appendChild(card);
  }
});

/* ── Copy and print ─────────────────────────────────────────────────────────
   What is copied is the RAW text, not what the sanitizer rendered: the point of
   the button is to paste a briefing into a note or a message, and markdown link
   syntax survives that better than a link whose href has been dropped on the
   floor. */
function flash(btn, word) {
  const label = btn.querySelector('.label');
  if (!label || btn.dataset.flashing) return;
  const original = label.textContent;
  btn.dataset.flashing = '1';
  label.textContent = word;
  setTimeout(() => { label.textContent = original; delete btn.dataset.flashing; }, 1600);
}

function cardAsText(entry) {
  const head = [entry.task.title, entry.task.schedule, entry.full.textContent]
    .filter(Boolean).join(' — ');
  return `${head}\n\n${entry.raw.trim() || 'No output yet.'}\n`;
}

function copyCard(entry, btn) {
  const text = cardAsText(entry);
  const done = () => flash(btn, 'Copied');
  /* The clipboard API needs a secure context, which this page has on GitHub
     Pages and on localhost — but NOT when it is opened straight off disk, which
     the README says it supports. The textarea fallback is what covers that. */
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, btn, done));
  } else {
    legacyCopy(text, btn, done);
  }
}

function legacyCopy(text, btn, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let okay = false;
  try { okay = document.execCommand('copy'); } catch (e) { okay = false; }
  ta.remove();
  okay ? done() : flash(btn, 'Copy failed');
}

/* Printing ONE card, from a page that prints all of them. The body class hides
   every other card for the duration; afterprint is what puts them back, and it
   fires whether the dialog was accepted or cancelled. */
function printCard(entry) {
  setOpen(entry, true);
  document.body.classList.add('printing-one');
  entry.card.classList.add('print-target');
  const restore = () => {
    document.body.classList.remove('printing-one');
    entry.card.classList.remove('print-target');
  };
  window.addEventListener('afterprint', restore, { once: true });
  window.print();
}

/* ── Expand all ─────────────────────────────────────────────────────────────
   The escape hatch from one-card-at-a-time. It acts on the VISIBLE cards, so
   during a search it expands the matches and nothing else. */
const expandBtn = document.getElementById('expandall');

function allVisibleOpen() {
  const vis = visibleCards();
  return vis.length > 0 && vis.every(isOpen);
}

function syncExpandBtn() {
  const open = allVisibleOpen();
  expandBtn.querySelector('.label').textContent = open ? 'Collapse all' : 'Expand all';
  expandBtn.disabled = visibleCards().length === 0;
}

expandBtn.addEventListener('click', () => {
  const closing = allVisibleOpen();
  visibleCards().forEach(e => setOpen(e, !closing));
  syncHash();
  syncExpandBtn();
});

/* ── The permalink ──────────────────────────────────────────────────────────
   The URL carries whichever single card is open, so one can be bookmarked or
   sent to somebody. replaceState rather than pushState: opening a card is
   reading, not navigating, and a history entry per click would turn Back into
   "close the card you just opened" for as long as you kept clicking.

   With several cards open — a search, or Expand all — there is no single card
   to name, so the hash comes off rather than naming an arbitrary one.

   try/catch because the README means it when it says this page works as a plain
   file:// document: some browsers throw a SecurityError on replaceState there,
   and losing the permalink is not a reason to lose the click that triggered it. */
function syncHash() {
  const open = openCards();
  const hash = open.length === 1 ? '#' + encodeURIComponent(open[0].task.id) : '';
  try {
    history.replaceState(null, '', location.pathname + location.search + hash);
  } catch (e) { /* file:// — the card is open either way */ }
}

function openFromHash(scroll) {
  let id = '';
  try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { return false; }
  const entry = cards.find(e => e.task.id === id);
  if (!entry) return false;
  collapseAll();
  setOpen(entry, true, scroll);
  syncExpandBtn();
  return true;
}

window.addEventListener('hashchange', () => openFromHash(true));

/* ── Search ─────────────────────────────────────────────────────────────────
   Until 2026-08-22 nothing on this page was findable. Card bodies are
   `display: none` while collapsed and only one card opens at a time, so the
   browser's own Ctrl+F reached exactly one card's text — eight tasks' worth of
   output with no way to search across it.

   Two characters is the floor: one letter matches most of the English language
   and would mark several thousand nodes per keystroke to say nothing. */
const searchBox = document.getElementById('search');
const searchNote = document.getElementById('searchnote');
const MIN_QUERY = 2;
let openBeforeSearch = null;
let wasSearching = false;

function currentQuery() { return searchBox.value.trim().toLowerCase(); }

function applySearch() {
  const q = currentQuery();
  const on = q.length >= MIN_QUERY;

  /* Remember what was open the moment a search starts, so clearing the box puts
     the page back where it was rather than dumping you on a collapsed grid. */
  if (on && !wasSearching) {
    const open = openCards();
    openBeforeSearch = open.length === 1 ? open[0].task.id : null;
  }

  let hits = 0;
  cards.forEach(e => {
    clearMarks(e.card);
    const hit = !on || e.haystack.includes(q);
    e.card.hidden = on && !hit;
    if (on && hit) {
      hits++;
      setOpen(e, true);
      markMatches(e.title, q);
      markMatches(e.meta, q);
      markMatches(e.body, q);
    }
  });

  if (on) {
    const shown = searchBox.value.trim();
    searchNote.textContent = hits === 0
      ? `No task mentions “${shown}”.`
      : `${hits} of ${cards.length} tasks match “${shown}” — expanded and highlighted below.`;
  } else {
    searchNote.textContent = '';
    if (wasSearching) {
      collapseAll();
      const back = openBeforeSearch && cards.find(e => e.task.id === openBeforeSearch);
      if (back) setOpen(back, true);
      openBeforeSearch = null;
    }
  }

  wasSearching = on;
  syncHash();
  syncExpandBtn();
}

/* Debounced: a card body is one long text node, and re-marking eight of them on
   every keystroke is work nobody sees the result of until you stop typing. */
let searchTimer = null;
searchBox.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applySearch, 120);
});
searchBox.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && searchBox.value !== '') {
    ev.preventDefault();          // don't let the browser's own search-field clear beat us to it
    searchBox.value = '';
    clearTimeout(searchTimer);
    applySearch();
  }
});
/* ⌘K / Ctrl+K — Money Map's shortcut for the same job, so the family agrees. */
document.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && !ev.altKey && ev.key.toLowerCase() === 'k') {
    ev.preventDefault();
    searchBox.focus();
    searchBox.select();
  }
});

/* ── The clock ──────────────────────────────────────────────────────────────
   Repaints every relative timestamp, and once the page has been open longer
   than the hourly push cycle, says so. This page has no service worker and no
   network of its own (`connect-src 'none'`), so it cannot check whether newer
   output exists — the notice says what it actually knows, which is how long ago
   this copy was loaded.

   Everything here is decided from wall-clock arithmetic rather than by counting
   ticks: a background tab's timers are throttled and may not fire at all, so an
   interval that had to run 60 times to be right would be wrong on every tab
   anyone left open. The visibility listener is what makes coming back to a tab
   immediate rather than up to a minute late. */
const LOADED_AT = Date.now();
const NUDGE_AFTER_MS = 65 * 60 * 1000;
const ageNotice = document.getElementById('agenotice');
const ageNoticeAge = document.getElementById('agenotice-age');

function tick() {
  cards.forEach(paintStamp);
  if (Date.now() - LOADED_AT >= NUDGE_AFTER_MS) {
    ageNoticeAge.textContent = timeAgo(LOADED_AT);
    ageNotice.hidden = false;
  }
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
document.getElementById('agenotice-refresh').addEventListener('click', () => location.reload());

syncExpandBtn();
openFromHash(true);
</script>
</body>
</html>
