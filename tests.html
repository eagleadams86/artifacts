<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- frame-src 'self' is the hidden iframe this suite boots claude.html in.
     connect-src 'self' is the fetch of privacy.html, which the landmark group
     below reads as text — it has to be spelled out, because it falls back to
     default-src, which is 'none' here, and a refused fetch shows up as three
     tests failing about a file that is plainly present. -->
<!-- api.github.com is the CI-scorecard line at the foot of this file, and the
     only off-origin host any page in this repo names. It is here because this
     page is published beside the ones it tests and refuses to RUN there, so
     without it a reader on the live site is told the suite cannot run and
     nothing at all about whether it passes. One public, unauthenticated read of
     a workflow's run list, from a dev page that already runs script. Every
     sibling repo's suite names the same host for the same line. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Tests</title>
<style>
  /* Dev-only page: pins claude.html's sanitizer (formatContent) — the function
     that decides what untrusted scheduled-task output may render as HTML — plus
     its timestamp helpers. Loads the real dashboard in a hidden same-origin
     iframe and calls its functions directly, so what's tested is what ships.
     Serve over http://localhost (python3 -m http.server 8015); file:// iframes
     are blocked in some browsers. Read-only: nothing here writes localStorage.
     Colours are the Midnight palette from the theme pack (dev page, hardcoded). */
  body { background: #0a0e1a; color: #e7eaf6; margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #838cab; font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid #262f4a; background: #121829; }
  #summary.ok  { color: #72fe84; border-color: #72fe84; }
  #summary.bad { color: #fb7874; border-color: #fb7874; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid #262f4a; vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: #72fe84; }
  tr.fail td.st { color: #fb7874; }
  tr.fail td.msg { color: #fb7874; }
  .msg { color: #838cab; font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: #838cab; border-bottom-color: #374163; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dashboard — Sanitizer Tests</h1>
  <p class="sub">Runs against the real <code>claude.html</code> in a hidden iframe. Read-only: nothing is saved.</p>
  <div id="summary">Loading dashboard…</div>
  <table><tbody id="out"></tbody></table>
</div>
<!-- The frame is built in script, not here: it boots the real dashboard, so it
     must not exist until the localhost gate at the foot of this file has passed. -->

<script>
'use strict';
const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
/* `detail` is the value that FAILED, not more prose: `ok(w <= pin, 'it fits',
   w + 'px')` says what was expected and then shows what was actually there.
   Every suite in the family takes three arguments now (2026-08-26). It was two
   here, and a call site passing a third had its diagnostic silently dropped —
   the assertion still failed correctly, it just refused to say what it saw.
   CodeQL's js/superfluous-trailing-arguments caught it three separate times in
   one day, in three different repos, which is what settled the signature. */
function ok(cond, note, detail) {
  if (cond) return;
  throw new Error((note || 'expected truthy')
    + (detail === undefined ? '' : ' \u2014 got ' + detail));
}
/* ── The completeness floor ─────────────────────────────────────────────────
   "Everything that ran passed" is only half an answer. Nothing above counts the
   tests, so a group deleted by accident — or a `PAGES.forEach` that ends up
   iterating nothing — takes its tests out of the suite silently, and the page
   and CI both go on reporting green over whatever is left. CI checks the words
   `All N tests pass` and has never cared what N is.

   This is what makes the count itself an assertion. It is the number the suite
   registers today, so ADDING a test never fails the build; removing one does,
   which is the moment to ask whether it should have gone. Lower it deliberately
   when a test is deliberately retired.

   It had drifted: 44 was pinned against a suite of 53 by 2026-08-23, and a floor
   several tests below the truth only catches a group being deleted once enough
   of them have already gone. Re-pinned to what actually runs when Find arrived. */
const EXPECTED = 58;
let w;

group('formatContent — escapes everything, then re-enables a tiny allowlist');
t('script tags come out as visible text, never markup', () => {
  eq(w.formatContent('<script>alert(1)<\/script>'),
     '&lt;script&gt;alert(1)&lt;/script&gt;');
});
t('bare strong/em/b/i/br are re-enabled, case-insensitively, self-closing too', () => {
  eq(w.formatContent('a <strong>b</strong> <EM>c</EM> d<br>e<br/>f'),
     'a <strong>b</strong> <em>c</em> d<br>e<br>f');
});
t('a tag carrying any attribute stays escaped as text', () => {
  const html = w.formatContent('<strong onclick=alert(1)>x</strong>');
  ok(html.includes('&lt;strong onclick=alert(1)&gt;'),
     'opening tag with attribute stays visible text: ' + html);
  ok(!/<strong\s/i.test(html), 'no live element with a handler can result: ' + html);
  // The bare closing tag legitimately matches the allowlist; only the opening
  // tag carried the attribute, and it must not.
});
t('markdown links become anchors — http(s) only, with noopener noreferrer', () => {
  const html = w.formatContent('see [the docs](https://example.com/a)');
  eq(html, 'see <a href="https://example.com/a" target="_blank" rel="noopener noreferrer">the docs</a>');
});
t('a javascript: link is never linked', () => {
  const html = w.formatContent('[click](javascript:alert(1))');
  ok(!html.includes('<a '), 'no anchor for a javascript: URL: ' + html);
});
t('a quote inside a URL cannot break out of the href attribute', () => {
  const html = w.formatContent('[x](https://e.com/a"onmouseover="alert(1))');
  ok(!/" *onmouseover/i.test(html.replace(/&quot;/g, '')), 'no live attribute escape');
  // The URL regex stops at the first ')', so the href ends at "alert(1" — and the
  // quotes inside it arrive entity-escaped, which is the property that matters.
  ok(html.includes('href="https://e.com/a&quot;onmouseover=&quot;alert(1"'),
     'quote arrives entity-escaped inside the attribute: ' + html);
});
t('non-string input renders as nothing', () => {
  eq(w.formatContent(null), '');
  eq(w.formatContent(undefined), '');
  eq(w.formatContent(42), '');
});

group('timestamps — a skewed clock is visible, not hidden');
t('a future timestamp reads "from now" rather than looking fresh', () => {
  ok(w.timeAgo(Date.now() + 3 * 3600000).endsWith('from now'));
});
t('recent and old stamps pick sensible units', () => {
  ok(w.timeAgo(Date.now() - 30000) === 'just now');
  ok(/^\d+m ago$/.test(w.timeAgo(Date.now() - 5 * 60000)));
  ok(/^\d+h ago$/.test(w.timeAgo(Date.now() - 3 * 3600000)));
  ok(/^\d+d ago$/.test(w.timeAgo(Date.now() - 49 * 3600000)));
});
t('parseStamp rejects junk instead of NaN-ing the sort', () => {
  eq(w.parseStamp('not a date'), null);
  eq(w.parseStamp(''), null);
  ok(typeof w.parseStamp('2026-08-03T12:00:00Z') === 'number');
});

group('Staleness — read from each task’s own schedule');
/* Added 2026-08-22. Until then this was ONE flat 8-day threshold for every card,
   which only ever caught the weeklies: the daily briefing could stop for three
   days and still wear an ordinary badge. */
t('a daily schedule is a day, a named weekday is a week', () => {
  eq(w.expectedIntervalMs('Every day at 1:45 AM'), 86400000);
  eq(w.expectedIntervalMs('Every Friday at 12:00 AM'), 7 * 86400000);
  eq(w.expectedIntervalMs('Every Wednesday at 12:30 AM'), 7 * 86400000);
  eq(w.expectedIntervalMs('Weekly'), 7 * 86400000);
});
t('and an explicit count is read as written', () => {
  eq(w.expectedIntervalMs('Every 6 hours'), 6 * 3600000);
  eq(w.expectedIntervalMs('Every 3 days'), 3 * 86400000);
});
t('a wording it does not know returns null, NOT a guess', () => {
  eq(w.expectedIntervalMs('When the mood takes it'), null);
  eq(w.expectedIntervalMs(undefined), null);
  // …and that null must fall back to the old flat rule rather than calling a
  // healthy task late, which is the whole reason it is null and not zero.
  eq(w.overdueAfterMs('When the mood takes it'), 8 * 86400000);
});
t('the grace is six hours, or the interval itself if that is shorter', () => {
  eq(w.overdueAfterMs('Every day at 1:45 AM'), 30 * 3600000);
  eq(w.overdueAfterMs('Every Friday at 12:00 AM'), (7 * 24 + 6) * 3600000);
  eq(w.overdueAfterMs('Every 2 hours'), 4 * 3600000);
});
t('a task that has missed its own slot reads overdue, and one that has not does not', () => {
  const daily = 'Every day at 1:45 AM';
  eq(w.stampState(Date.now() - 20 * 3600000, daily), 'fresh');
  eq(w.stampState(Date.now() - 40 * 3600000, daily), 'overdue');
  // The same 40 hours is nowhere near late for a weekly task.
  eq(w.stampState(Date.now() - 40 * 3600000, 'Every Friday at 12:00 AM'), 'fresh');
});
t('no readable stamp is UNKNOWN, a different state from overdue', () => {
  eq(w.stampState(null, 'Every day at 1:45 AM'), 'unknown');
});

group('Search — highlighting goes in and comes back out again');
t('matches are wrapped in <mark>, and the text is unchanged when they are removed', () => {
  const d = w.document;
  const box = d.createElement('div');
  box.innerHTML = 'Beta 6 and beta 7 <strong>and beta 8</strong>';
  const before = box.textContent;
  eq(w.markMatches(box, 'beta'), 3, 'case-insensitive, across an element boundary');
  eq(box.querySelectorAll('mark.hit').length, 3);
  ok(box.querySelector('strong'), 'the sanitizer’s own markup must survive being marked');
  w.clearMarks(box);
  eq(box.querySelectorAll('mark.hit').length, 0);
  eq(box.textContent, before, 'the text must come back exactly as it was');
});
t('and a cleared search leaves no seam the next one cannot match across', () => {
  const box = w.document.createElement('div');
  box.textContent = 'beta 6 is a polish release';
  w.markMatches(box, 'beta');
  w.clearMarks(box);
  /* Without normalize() the text is still split where the old mark was, and
     "beta 6" — a phrase spanning that seam — silently matches nothing. */
  eq(w.markMatches(box, 'beta 6'), 1, 'normalize() must have re-joined the text');
});
t('the needle is matched literally — a regex character is not a wildcard', () => {
  const box = w.document.createElement('div');
  box.textContent = 'a+b and axb';
  eq(w.markMatches(box, 'a+b'), 1, 'if this is 2, the needle reached a RegExp');
});

/* The fixture is what the app hands searchApp: what each card SAYS, with the
   body's rendered text rather than the raw markdown behind it. The matcher never
   touches the DOM, which is the whole reason it can be pinned here. */
const FIND_ITEMS = [
  { id: 'news', title: 'Daily News Briefing', description: 'The morning read',
    schedule: 'Every day at 6:00 AM', when: 'Updated 2h ago',
    text: 'Apple shipped beta 6\nnothing to see\nbeta 7 and beta 8 landed\n' },
  { id: 'watch', title: 'Beta Watch', description: 'iOS betas', schedule: 'Every Monday',
    when: 'Updated 3d ago', text: '' }
];

group('Find — what a hit is, and where in the card it points');
t('one character finds nothing: the floor is two', () => {
  eq(w.searchApp(FIND_ITEMS, 'b'), { hits: [], more: 0 });
  eq(w.searchApp(FIND_ITEMS, ' '), { hits: [], more: 0 }, 'trimmed before it is counted');
});
t('a card matches on its own title, description and schedule, ahead of its output', () => {
  const { hits } = w.searchApp(FIND_ITEMS, 'beta');
  const own = hits.filter(h => h.mark === -1);
  eq(own.length, 1, 'exactly one card names itself after a beta');
  eq(own[0].id, 'watch');
  eq(own[0].snippet, 'iOS betas', 'the description is what a card-level hit shows');
  /* A card with no output yet contributes nothing else — the "waiting for first
     run" placeholder is the page talking, not the task. */
  eq(hits.filter(h => h.id === 'watch').length, 1);
});
t('every matching LINE of the output is its own hit, in reading order', () => {
  const lines = w.searchApp(FIND_ITEMS, 'beta').hits.filter(h => h.id === 'news');
  eq(lines.map(h => h.snippet),
     ['Apple shipped beta 6', 'beta 7 and beta 8 landed']);
  eq(lines.map(h => h.when), ['Updated 2h ago', 'Updated 2h ago'],
     'the third line of a hit is the card’s own freshness');
});
t('a second match on a line already listed does not repeat it — but it still counts', () => {
  /* `mark` is an index into the marks markMatches will make, so it has to count
     EVERY occurrence: "beta 8" is the third one, and the line it shares with
     "beta 7" is listed once, at index 1. */
  const lines = w.searchApp(FIND_ITEMS, 'beta').hits.filter(h => h.id === 'news');
  eq(lines.map(h => h.mark), [0, 1]);
});
t('and that index lands on the mark markMatches actually makes', () => {
  const box = w.document.createElement('div');
  box.textContent = FIND_ITEMS[0].text;
  eq(w.markMatches(box, 'beta'), 3, 'three occurrences across the three lines');
  const marks = box.querySelectorAll('mark.hit');
  const second = w.searchApp(FIND_ITEMS, 'beta').hits.filter(h => h.id === 'news')[1];
  ok(marks[second.mark].nextSibling.nodeValue.startsWith(' 7'),
     'the index pointed at the wrong match: ' + marks[second.mark].nextSibling.nodeValue.slice(0, 12));
});
t('the cap is hard, and what it dropped is counted rather than silently lost', () => {
  const cap = w.__dashTestHooks.SEARCH_CAP;
  const text = Array.from({ length: cap + 20 }, (_, i) => 'zeta line ' + i).join('\n');
  const r = w.searchApp([{ id: 'x', title: 'X', description: '', schedule: '', when: '', text }], 'zeta');
  eq(r.hits.length, cap);
  eq(r.more, 20, 'the overflow is the number the window says "and N more" about');
});

group('The controls the cards are driven by');
t('Find is a button in the header, and the field it replaced has gone', () => {
  const btn = w.document.getElementById('findBtn');
  ok(btn, 'no Find button');
  ok(/find/i.test(btn.textContent), 'unexpected label: ' + btn.textContent);
  ok(/⌘K/.test(btn.title || ''), 'the title names the shortcut in every sibling app');
  ok(!w.document.getElementById('search'), 'the old header search field is still here');
});
t('the Find window has a labelled box and an EMPTY live region for the count', () => {
  const d = w.document;
  const dlg = d.getElementById('searchDialog');
  ok(dlg, 'no Find window');
  eq(dlg.tagName, 'DIALOG', 'it is a real <dialog>, like every other window here');
  const box = d.getElementById('searchBox');
  ok(box, 'no search box in the window');
  ok(d.querySelector('label[for="searchBox"]'), 'a placeholder is not a label');
  const count = d.getElementById('searchCount');
  ok(count, 'no result count element');
  eq(count.getAttribute('role'), 'status');
  /* Toggling a status region out of `hidden` is announced unreliably; one that
     is present and empty, and then gains text, is not. */
  ok(!count.hasAttribute('hidden'), 'it must not be hidden — .sr-only keeps it off screen');
});
t('Expand all carries its state in its own label', () => {
  const btn = w.document.getElementById('expandall');
  ok(btn, 'no expand-all button');
  const label = btn.querySelector('.label');
  ok(label, 'the label is a span the script rewrites — without it the state never changes');
  ok(/expand all|collapse all/i.test(label.textContent), 'unexpected label: ' + label.textContent);
});
t('every card offers Copy and Print', () => {
  const card = w.document.querySelector('.card');
  ok(card, 'no cards rendered');
  ok(card.querySelector('.act-copy'), 'no Copy button on the card');
  ok(card.querySelector('.act-print'), 'no Print button on the card');
});
t('the page-age notice is present, hidden, and wired to a refresh', () => {
  const d = w.document;
  ok(d.getElementById('agenotice'), 'no page-age notice');
  ok(d.getElementById('agenotice').hasAttribute('hidden'), 'it must start hidden');
  ok(d.getElementById('agenotice-age'), 'nothing for the script to write the age into');
  ok(d.getElementById('agenotice-refresh'), 'the notice has to offer the reload it asks for');
});
t('an unknown permalink opens nothing rather than throwing', () => {
  /* The hash is a card id. Anything else — a stale link, a typo, the skip
     link's own #grid — must simply not match. */
  eq(typeof w.openFromHash, 'function');
  eq(w.openFromHash(false), false, 'nothing should match with no task hash set');
});

group('Landmarks — the keyboard’s way past the header');
/* Added 2026-08-21, when the dashboard grew the family header: a brand, two
   pickers and a Refresh button, all before the first card. Every sibling app
   has had a skip link since 2026-08-20 and this page was the last without one,
   so a keyboard or screen-reader user tabbed the whole row on every load. */
t('there is a skip link, and it points at the main landmark', () => {
  const d = w.document;
  const skip = d.querySelector('a.skip');
  ok(skip, 'no skip link on the dashboard');
  eq(skip.getAttribute('href'), '#grid', 'the skip link must land on <main id="grid">');
  ok(/skip to content/i.test(skip.textContent), 'and say so: ' + skip.textContent);
});
t('and it is the FIRST thing in the tab order', () => {
  const d = w.document;
  const first = d.querySelector('body a[href], body button, body select, body input');
  ok(first && first.classList.contains('skip'),
     'something else comes before the skip link: ' + (first ? first.outerHTML.slice(0, 80) : 'nothing'));
});
t('main can take focus, so the skip link actually moves it', () => {
  const main = w.document.getElementById('grid');
  ok(main, 'no #grid element');
  eq(main.tagName, 'MAIN', 'the skip target must be the main landmark itself');
  eq(main.getAttribute('tabindex'), '-1',
     'without tabindex="-1" focus never lands and the link only scrolls');
});
t('the footer names NOTICE and LICENSE separately, as the family does', () => {
  /* It was `footer.site-footer`, one long line of links. Since 2026-08-23 every
     page in the family wears Sprint Predictability's three-line footer, so the
     element is a plain <footer> with a .footnotes wrapper inside it — and that
     wrapper is load-bearing, because `footer` is a flex ROW and without it the
     three lines lay out side by side. */
  const foot = w.document.querySelector('footer .footnotes');
  ok(foot, 'no contentinfo footer on the dashboard');
  eq(foot.parentElement.tagName, 'FOOTER', 'and .footnotes must sit directly inside it');
  eq(foot.querySelectorAll('p.privacy').length, 3,
     'three lines: what it does with your data, the links, and the authorship');
  const byLabel = {};
  foot.querySelectorAll('a[href]').forEach((a) => { byLabel[a.textContent.trim()] = a.href; });
  /* They were ONE link, reading "MIT licensed" and landing on NOTICE. A licence
     is the terms; NOTICE is who owns it. A link whose words and destination
     disagree is the kind of thing nobody checks twice. */
  ok(/NOTICE$/.test(byLabel['independent personal project'] || ''),
     '"independent personal project" must point at NOTICE');
  ok(/LICENSE$/.test(byLabel['MIT licensed'] || ''),
     '"MIT licensed" must point at LICENSE, not NOTICE');
  ok(byLabel['How it works'], 'the repo link is labelled "How it works" family-wide');
  ok(byLabel['Privacy policy'], 'and the policy is linked from here');
});

group('privacy.html — the family footer and its landmarks');
t('the privacy page exists — the dashboard footer links straight at it', () => {
  ok(PRIVACY_SRC, 'privacy.html is missing');
});
t('it carries How it works and the authorship line, but not a link to itself', () => {
  ok(/>How it works</.test(PRIVACY_SRC),
     'the repo link is labelled "How it works" family-wide');
  ok(/MIT licensed/.test(PRIVACY_SRC), 'and the authorship line every public page has');
  ok(/blob\/main\/NOTICE/.test(PRIVACY_SRC),
     '"independent personal project" must point at NOTICE, as the dashboard footer does');
  ok(!/href="privacy\.html"/.test(PRIVACY_SRC),
     'and NOT a privacy link, which on the privacy page points at itself');
});
/* ── The default theme ───────────────────────────────────────────────────────
   It moved from midnight to auto on 2026-08-22, so a reader who has never touched the
   picker follows their own system. On the dashboard it lives in THREE places which have
   to agree, and none of them can see the other two: the <html> attribute (what a browser
   with script disabled paints), the boot script (what a reader with nothing — or
   something retired — saved gets), and the picker's `selected` (what the header ROW
   reads while both of those happen). Any one left on midnight is a silent disagreement,
   and silent in the direction that hides it: on a dark-mode machine every combination
   looks identical. privacy.html has the first two and no picker. */
t('the default theme is auto, on both pages', () => {
  ok(APP_SRC && PRIVACY_SRC, 'a page did not load, so nothing below proves anything');
  for (const [name, src] of [['claude.html', APP_SRC], ['privacy.html', PRIVACY_SRC]]) {
    ok(/<html[^>]*\sdata-theme="auto"/.test(src),
      name + ': <html> must carry data-theme="auto", or a script-less load falls back to '
      + ":root's midnight");
    ok(/THEMES\.indexOf\(t\) > -1 \? t : 'auto'|ok\.indexOf\(t\) === -1 \? 'auto' : t/.test(src),
      name + ': the boot script must land nothing-saved and retired ids on auto');
  }
  ok(/<option value="auto" selected>/.test(APP_SRC),
    'auto must carry `selected` in the picker markup, or the row names another theme '
    + 'until the script at the foot of the file runs');
  eq((APP_SRC.match(/<option value="(?:auto|midnight|dark|light|sepia)" selected>/g) || []).length,
    1, 'exactly one theme option may carry `selected`');
});
/* ── The share window ────────────────────────────────────────────────────────
   Added 2026-08-23, when this page joined the six apps that already had one.
   indexOf, not regexes: a pattern holding `</`, a backtick or a quote inside a
   <script> in an HTML file is a thing to get wrong, and a substring says exactly
   what it is looking for. */
group('Share — the family window, and the one sink it feeds');
t('the window is the family\'s, to the frame', () => {
  ok(APP_SRC.indexOf('id="shareDialogTitle">Share a Read-Only Link<') !== -1,
     'every sibling calls it the same thing');
  ok(APP_SRC.indexOf('id="shareCopyBtn"') !== -1
     && APP_SRC.indexOf('id="shareOpenBtn"') !== -1
     && APP_SRC.indexOf('id="shareCloseBtn"') !== -1, 'and uses their three button ids');
  ok(APP_SRC.indexOf('aria-label="Read-only share link"') !== -1, 'the link box says what it is');
  ok(APP_SRC.indexOf('<strong>snapshot</strong>') !== -1, 'and it closes on the snapshot warning');
  ok(APP_SRC.indexOf('#shareDialog { max-width: 1100px; padding: 18px; }') !== -1,
     '1100px, which is what the six apps open Share at');
});
t('a shared card body goes through the SANITIZER, like every other one', () => {
  /* The one that matters. A link is untrusted by definition — whoever holds it
     can edit it — so its content must reach a card body the same way the live
     data does, through formatContent, which is the only path to innerHTML on
     this page. */
  ok(APP_SRC.indexOf('entry.body.innerHTML = entry.raw.trim()') !== -1
     && APP_SRC.indexOf('? formatContent(entry.raw)') !== -1,
     'a shared body must be built by formatContent, never inserted raw');
});
t('a link carries the output and NOT the page\'s own copy of the task list', () => {
  /* Titles, schedules and descriptions are hard-coded in TASKS on the page
     reading the link. Sending them would send a copy of something the reader
     already has — and a copy that could disagree with it. */
  const fn = APP_SRC.slice(APP_SRC.indexOf('function buildSharePayload'),
                           APP_SRC.indexOf('async function encodeShare'));
  ok(fn.indexOf('id: e.task.id') !== -1, 'the id rides');
  ok(fn.indexOf('updatedAt') !== -1 && fn.indexOf('content') !== -1, 'so do the stamp and output');
  ok(fn.indexOf('title') === -1 && fn.indexOf('schedule') === -1 && fn.indexOf('description') === -1,
     'the task metadata does not — the reading page has its own');
});
t('a shared view does not let the permalink eat its own token', () => {
  /* syncHash replaces the hash with whichever card is open. In a shared view
     that hash IS the snapshot, so the first click would throw it away. */
  const fn = APP_SRC.slice(APP_SRC.indexOf('function syncHash'),
                           APP_SRC.indexOf('function openFromHash'));
  ok(fn.indexOf('if (viewOnly) return;') !== -1, 'syncHash must stand down in a shared view');
  ok(APP_SRC.indexOf('if (viewOnly) return false;') !== -1,
     'and openFromHash must not read the token as a card id');
});
t('a `hidden` element is hidden, whatever class it wears', () => {
  /* The UA's own `[hidden] { display: none }` loses to ANY author rule that sets
     display, whatever the specificity. This page patched that one class at a
     time until the shared-view banner shipped as `display: flex` and left an
     empty bordered strip under the header on the live page. */
  ok(APP_SRC.indexOf('[hidden] { display: none !important; }') !== -1,
     'the family states this once, globally, and !important so source order cannot matter');
  /* The RULES, not the selectors: the comment above the global rule names both of
     them, and a test that matched the prose would fail the moment the fix was
     explained. */
  ok(APP_SRC.indexOf('.card[hidden] { display:') === -1
     && APP_SRC.indexOf('.notice[hidden] { display:') === -1,
     'and the per-class patches go with it, or someone adds a fourth');
});
t('every window centres itself, despite the universal margin reset', () => {
  /* A <dialog> centres with `margin: auto`, and `* { margin: 0 }` at the top of
     this file takes that away from everything. No sibling app needs to say this
     because none of them has a universal margin reset. It is said ONCE now, on
     the base `dialog` rule this page gained when Find became its second window
     — before that the share window carried the whole chrome itself. */
  ok(/\* \{ box-sizing: border-box; margin: 0;/.test(APP_SRC), 'the reset is still there');
  ok(APP_SRC.indexOf('dialog { margin: auto;') !== -1,
     'so the dialogs have to hand themselves their margin back, or they open in the corner');
  ok(APP_SRC.indexOf('#shareDialog { margin: auto;') === -1,
     'and the share window must not go back to declaring its own chrome');
});
t('the cards are held back until the snapshot is in them', () => {
  ok(APP_SRC.indexOf('html[data-share-pending] #grid { visibility: hidden; }') !== -1,
     'or a shared view flashes the LIVE briefing and then corrects itself');
  ok(APP_SRC.indexOf("removeAttribute('data-share-pending')") !== -1,
     'and it has to come off again — on the failure path as well as the good one');
});
t('the policy sits in <main>, and the footer comes after it', () => {
  /* Comments stripped FIRST, and looped rather than a single pass — the notes
     beside both elements name them in prose, so a page that had lost the
     element and kept the note would otherwise still pass. */
  const bare = stripHtmlComments(PRIVACY_SRC);
  ok(/<main>/.test(bare),
     'no main landmark, so contentinfo would be the only one on the page');
  /* Matched by the WRAPPER's class, never by a bare '<footer'. A bare match
     passes on the prose in the <style> block's own comment, which an
     HTML-comment strip does not reach. `class="foot"` served that purpose on the
     element itself until 2026-08-23, when every page in the family moved to
     Sprint Predictability's footer treatment; `.footnotes` serves it now — and
     it is load-bearing rather than decorative, because `footer` is a flex ROW
     and without the wrapper the lines lay out side by side. */
  ok(/<div class="footnotes">/.test(bare),
     'the footer is a real <footer> — a contentinfo landmark, not a styled paragraph');
  ok(bare.indexOf('</main>') < bare.indexOf('<div class="footnotes">'),
     'with main CLOSED before it: a <footer> inside main is not contentinfo at all');
});

/* HTML comments explain things by naming them — including the very elements the
   assertions above look for. Looped until the string stops changing rather than
   a single .replace(): one pass over a multi-character delimiter can leave a NEW
   opener behind that the pass already went past, so a single pass is only as
   good as the input is well-formed. CodeQL's
   js/incomplete-multi-character-sanitization flags the single-pass form; the
   same helper, with the same wording, is in every sibling repo's suite. */
function stripHtmlComments(str) {
  let out = String(str), prev;
  do { prev = out; out = out.replace(/<!--[\s\S]*?-->/g, ''); } while (out !== prev);
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   The offline worker (2026-08-22). This page was the one in the family without
   one, on the argument that a cached copy of hourly task output presented as
   current is a wrong answer rather than an old page. That objection is right,
   and network-first is what answers it — which is what the five siblings were
   doing all along.
   ══════════════════════════════════════════════════════════════════════════ */
group('sw.js — the offline shell');

const swStrip = (src) => src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');

t('sw.js and its kill switch both exist', () => {
  ok(SW_SRC, 'sw.js is missing');
  ok(KILL_SRC, 'sw-kill.js is missing — the escape hatch has to exist BEFORE it is needed');
});
/* Exact equality, not "contains". A new entry has to be added here too, which
   is the moment to ask whether the file is genuinely public. */
t('caches only files that are already public in this repo', () => {
  const list = (SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/) || [null, ''])[1];
  const shell = [...list.matchAll(/'([^']+)'/g)].map((x) => x[1]).sort();
  eq(shell, ['./', 'claude.html', 'favicon.ico', 'icon-192.png', 'icon-512-maskable.png',
             'icon-512.png', 'manifest.webmanifest', 'privacy.html', 'theme.css']);
});
/* The one pattern, and the only place this worker differs from its siblings.
   It has to stay tight: the drafts sit in the same directory as the task
   output, and they are NOT public content this page ever shows. */
t('the data pattern reaches the task output and nothing beside it', () => {
  const re = (SW_SRC.match(/const DATA_RE = (\/.*\/);/) || [])[1];
  ok(re, 'DATA_RE is missing — the task output would not be cached at all');
  const m = new RegExp(re.slice(1, -1));
  for (const good of ['data/data-daily-news-briefing.js', 'data/data-glp1-daily-news.js'])
    ok(m.test(good), good + ' should be cached — it is what the page shows');
  for (const bad of ['data/briefing.md', 'data/data-daily-news-briefing-draft.md',
                     'data/../CLAUDE.md', 'data/sync.log', 'tests.html'])
    ok(!m.test(bad), bad + ' must never be cached');
});
t('never caches the notes, the suite or the sync machinery', () => {
  const list = (SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/) || [null, ''])[1];
  const shell = [...list.matchAll(/'([^']+)'/g)].map((x) => x[1]);
  /* Anchored on the whole entry, not a substring: this page's own file is
     claude.html, so a bare /CLAUDE/i — which is what the sibling suites use,
     where the app is index.html — bans the app itself. */
  const banned = [/^tests\.html$/, /\.py$/, /\.sh$/, /\.log$/, /\.md$/i,
                  /^CLAUDE\.md$/i, /^README/i];
  for (const entry of shell)
    for (const pat of banned) ok(!pat.test(entry), '"' + entry + '" must never be cached');
});
t('touches nothing cross-origin, and has no eval', () => {
  /* Guarded before the negations below. Every assertion in this test is a NOT,
     and a NOT over an empty string passes — so a file that failed to load would
     report green here while proving nothing. The test that reads the file says
     so too, but its failure does not stop this one printing a tick. */
  ok(SW_SRC, 'sw.js did not load — the negations below would all pass on an empty string');
  const SW = swStrip(SW_SRC);
  ok(!/https?:\/\//.test(SW), 'sw.js names an off-origin URL in executable code');
  /* A worker on Pages runs with NO CSP at all, so these are not merely untidy. */
  ok(!SW.includes('eval(') && !SW.includes('importScripts(') && !SW.includes('new Function('),
     'sw.js must have no eval, importScripts or new Function');
});
t('deletes only its own caches — the origin is shared', () => {
  ok(/startsWith\(PREFIX\)/.test(swStrip(SW_SRC)), 'activate must guard caches.delete with the prefix');
  ok(/const PREFIX = 'dash-shell-';/.test(SW_SRC), 'and the prefix must be this page\u2019s');
});
/* THE test on this page, and the whole reason it is allowed to have a worker. */
t('is network-first, so a cached briefing needs a network that actually failed', () => {
  const SW = swStrip(SW_SRC);
  ok(/Promise\.race/.test(SW) && /cache\.match/.test(SW), 'expected the network-first race');
  ok(!/caches\.match\(req\)\s*\.then\(\s*\(?r\)?\s*=>\s*r\s*\|\|/.test(SW),
     'this looks cache-first — a stale briefing shown as current is the thing this page ruled out');
  ok(/!res\.ok && cached/.test(SW),
     'a same-origin error reply with a cached copy in hand must serve the cache');
});
/* The bug this test exists for shipped WITH the worker and hid for two days: a
   plain `fetch(req)` inherits the cache mode of the request the page made, so
   on an ordinary reload the browser's own HTTP cache answered it, the page was
   handed that copy as if it were the network's, and `cache.put` wrote it back
   over the offline copy. Pages sends `max-age=600`, so pressing Refresh in the
   ten minutes after a task published new output showed the OLD output — and
   only a hard reload, which bypasses the worker, showed the new. Network-first
   has to mean the network, not "whatever the browser has to hand". */
t('goes to the network even when the browser has a fresh copy of its own', () => {
  const SW = swStrip(SW_SRC);
  ok(/fetch\(req, \{ cache: 'no-cache' \}\)/.test(SW),
     'the serving fetch must opt out of the HTTP cache, or an ordinary reload is answered from it');
  ok(!/fetch\(req\)/.test(SW),
     'a bare fetch(req) is the bug: it inherits the page request\u2019s cache mode');
});
t('can repair its cache without a new worker version', () => {
  const SW = swStrip(SW_SRC);
  ok(/addEventListener\(\s*'message'/.test(SW) && /'shell-check'/.test(SW),
     'the worker must accept a shell-check message');
  ok(/if \(reg\.active\) reg\.active\.postMessage\(\{ type: 'shell-check' \}\)/.test(APP_SRC),
     'and the page must ask for one on load');
  ok(!/addAll/.test(SW), 'addAll rejects the whole precache on a single 404, silently');
});
t('accepts only its own signal, and reads nothing out of it', () => {
  const SW = swStrip(SW_SRC);
  ok(/e\.data\.type !== 'shell-check'\) return;/.test(SW),
     'the message handler must reject anything but shell-check');
  ok(!/e\.data\.(url|urls|path|cache|key)/.test(SW),
     'and must never take a URL or cache name out of a message');
});
t('the kill switch stays a pure uninstaller', () => {
  const KILL = swStrip(KILL_SRC);
  ok(/unregister\(\)/.test(KILL), 'sw-kill.js must unregister itself');
  ok(!/addEventListener\(\s*'fetch'/.test(KILL), 'and intercept nothing — inert is the point');
  ok(!/cache\.put|addAll/.test(KILL), 'and never cache anything');
  ok(/startsWith\('dash-shell-'\)/.test(KILL), 'and clear only this page\u2019s caches');
});
t('the page declares worker-src and guards registration', () => {
  /* \\s+ between the attributes: this page wraps the meta tag across two lines,
     so the single-space form the sibling suites use matches nothing here and
     the check passes vacuously — which is worse than failing. */
  const csp = (APP_SRC.match(/http-equiv="Content-Security-Policy"\s+content="([^"]+)"/) || [])[1] || '';
  ok(csp, 'no CSP found in claude.html — the regex below would pass on an empty string');
  ok(/worker-src 'self'/.test(csp),
     "the CSP must spell out worker-src 'self', not lean on the fallback chain");
  ok(!/worker-src[^;]*https?:/.test(csp), 'and admit no off-origin host there');
  ok(/window\.top !== window\.self/.test(APP_SRC),
     'registration must skip frames, or this suite would install a worker on itself');
  ok(/window\.addEventListener\('load', function \(\) \{/.test(APP_SRC),
     'and wait for load rather than compete with first paint');
});



/* ── The scorecard, where the suite itself can't run ─────────────────────────
   Refusing to run and then saying nothing about whether the tests pass is half
   an answer: the question someone opens this page to ask is "is it green?".
   The same suite runs headless in CI on every push, so ask GitHub how that went
   and show it here. Nothing is booted and nothing is stored — it is one public,
   unauthenticated read of a workflow's run list. Same block, same wording, as
   every sibling repo's suite.
─────────────────────────────────────────────────────────────────────────── */
function showLatestRun() {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:14px;line-height:1.6;padding:12px 16px';
  td.textContent = 'Checking the latest CI run…';
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);

  fetch('https://api.github.com/repos/eagleadams86/artifacts/actions/workflows/tests.yml/runs?branch=main&per_page=1')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => {
      const run = d && d.workflow_runs && d.workflow_runs[0];
      if (!run) { td.textContent = 'No CI runs found for this repository yet.'; return; }
      const done = run.status === 'completed';
      const okRun = run.conclusion === 'success';
      tr.className = !done ? '' : (okRun ? 'pass' : 'fail');
      const when = run.updated_at ? new Date(run.updated_at).toLocaleString() : '';
      const sha = String(run.head_sha || '').slice(0, 7);
      /* Only ever build an <a> when the API really did hand back a GitHub https
         URL — the same guard the app uses for any URL out of an API. */
      const url = String(run.html_url || '');
      td.textContent = (!done ? '⏳ The latest run is still going'
        : okRun ? '✓ The full suite passed in CI' : '✕ The suite FAILED in CI')
        + (when ? ' — ' + when : '') + (sha ? ' · commit ' + sha : '') + '. ';
      if (/^https:\/\/github\.com\//.test(url)) {
        const a = document.createElement('a');
        a.href = url; a.rel = 'noopener noreferrer';
        a.textContent = 'Open the run for the full scorecard';
        td.appendChild(a);
      }
    })
    .catch(() => { td.textContent = 'Could not reach GitHub to check the latest CI run.'; });
}

/* ── Runner ───────────────────────────────────────────────────────────────── */
/* ── The localhost gate ─────────────────────────────────────────────────────
   The family rule, applied here too: the published page should not boot a live
   copy of anything. This suite is read-only about storage, but the principle is
   the same one the sibling apps enforce — a test page on the public site should
   test a copy you are serving, not the copy someone is looking at.

   file:// is NOT in this list, deliberately: it has no hostname, and treating
   it as local would build a frame a browser then blocks, leaving the page to
   blame the code for what is a setup problem.
─────────────────────────────────────────────────────────────────────────── */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

let PRIVACY_SRC = '', SW_SRC = '', KILL_SRC = '', APP_SRC = '';

window.addEventListener('load', () => {
  if (!LOCAL_HOSTS.includes(location.hostname)) return refuse();
  /* Every read below is cache-BUSTED, as the sibling suites' bustFetch does, for
     one reason: a page served from a cache makes this suite grade a file that is
     no longer on disk. It then fails in whichever direction the cache happens to
     be stale in — a green run over yesterday's file, or a red one over a change
     that landed minutes ago — and neither reading is about the code.

     Worth knowing what this does and does not reach. It defeats the HTTP cache.
     It does NOT defeat a registered SERVICE WORKER, which is what actually bit on
     2026-08-22: this suite never installs one, but claude.html opened in an
     ordinary tab does, the origin is shared with every sibling app, and the worker
     then answered these fetches out of `dash-shell-v1` — a 65KB claude.html when
     the file on disk was 69KB, so the theme-default check below went red against a
     copy that predated the change. curl saw the new file the whole time. If a read
     here ever disagrees with the disk again, unregister the worker and clear the
     caches for the origin before believing a word of it. */
  const bust = (f) => f + (f.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now();
  const bustFetch = (f) => fetch(bust(f), { cache: 'no-store' });
  /* Read alongside the frame rather than after it: the runner is synchronous
     once it starts, so anything a test reads has to be in hand before then. */
  bustFetch('privacy.html').then((r) => (r.ok ? r.text() : '')).then((t) => { PRIVACY_SRC = t; })
    .catch(() => {});
  /* The offline worker is read as TEXT rather than exercised as a live one, and
     that is the point rather than a shortcut: registration is frame-guarded, so
     this suite never installs a worker — one that did would be testing whatever
     it had cached instead of the files on disk. */
  bustFetch('sw.js').then((r) => (r.ok ? r.text() : '')).then((t) => { SW_SRC = t; }).catch(() => {});
  bustFetch('sw-kill.js').then((r) => (r.ok ? r.text() : '')).then((t) => { KILL_SRC = t; }).catch(() => {});
  bustFetch('claude.html').then((r) => (r.ok ? r.text() : '')).then((t) => { APP_SRC = t; }).catch(() => {});
  const frame = document.createElement('iframe');
  frame.id = 'app';
  frame.src = bust('claude.html');
  frame.title = 'dashboard under test';
  frame.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(frame);
  const start = () => setTimeout(run, 250); // also lets the privacy.html fetch above land
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete'
      && frame.contentWindow.formatContent) start();
  else frame.addEventListener('load', start, { once: true });
});

/* Two reasons to land here, needing different sentences: the published site and
   a file:// copy off disk (where it cannot work at all — browsers block file://
   frames). Both end at the same instruction. */
function refuse() {
  const onDisk = location.protocol === 'file:';
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = onDisk
    ? 'Not run from a file — this page needs a local server.'
    : 'Not run here — this page boots a live copy of the dashboard.';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:13px;line-height:1.6';
  td.innerHTML = (onDisk
    ? 'The suite loads the dashboard in a hidden frame to test it, and a browser blocks that '
      + 'frame when the page is opened straight off disk — so the tests would have nothing to '
      + 'run against. Serve the folder instead:'
    : 'The suite loads the dashboard in a hidden frame to test it, which on the published site '
      + 'means booting a live copy. It runs on <code>localhost</code> only, against a copy '
      + 'served from the repo folder:') +
    '<br><br><code>cd ~/claude-dashboard &amp;&amp; python3 -m http.server 8015</code><br>' +
    'then open <code>http://localhost:8015/tests.html</code>.<br><br>' +
    'Nothing has been changed by opening this page — <a href="claude.html">back to the dashboard</a>.';
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);
  showLatestRun();
}

function run() {
  w = document.getElementById('app').contentWindow;
  /* A frame that never got claude.html is a SETUP problem — opened off disk, or
     with nothing serving the folder — and without this every test throws
     "Cannot read properties of undefined" in turn, which reads like the
     sanitizer is broken. Say the one thing that fixes it instead. */
  if (!w || typeof w.formatContent !== 'function') {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'The hidden frame never loaded claude.html — is this folder being served?';
    document.getElementById('out').innerHTML =
      '<tr><td class="msg" style="white-space:normal;font-family:inherit;font-size:13px">' +
      'Run <code>cd ~/claude-dashboard &amp;&amp; python3 -m http.server 8015</code> and open ' +
      '<code>http://localhost:8015/tests.html</code>.</td></tr>';
    return;
  }
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      tr.innerHTML = '<td colspan="3"></td>';
      tr.firstChild.textContent = item.group;
      out.appendChild(tr);
      continue;
    }
    const tr = document.createElement('tr');
    const st = document.createElement('td'); st.className = 'st';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td'); msg.className = 'msg';
    try {
      item.fn();
      tr.className = 'pass'; st.textContent = '✓'; pass++;
    } catch (e) {
      tr.className = 'fail'; st.textContent = '✕'; msg.textContent = e.message; fail++;
    }
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
  }
  /* The floor — see EXPECTED at the top of this file. Written as a row of its
     own so it reads like any other failure, and counted into `fail` so the
     summary goes red and CI's `All N tests pass` check does not match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '\u2715';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least '
      + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here '
      + 'would cover a fraction of the suite. If they were retired on purpose, lower '
      + 'EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? `All ${pass} tests pass` : `${fail} of ${pass + fail} tests FAILED`;
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}
</script>
